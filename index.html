/* Один и тот же вход с трёх экранов: разные надписи читались как разные
   возможности, хотя ведут в одно место. */
function fbLink(id){
  return '<button class="fblink" id="' + id + '">' +
    '<span class="hornic">' + IC.horn + '</span>Поделиться обратной связью</button>';
}
function fbFormOn(){ return !!FEEDBACK_URL; }
function fbTgOn(){ return !!TELEGRAM_URL; }
function fbAvailable(){ return fbFormOn() || fbTgOn(); }

/* Что уходит вместе с отзывом: счётчики и настройки, чтобы можно было
   воспроизвести баг. Имена и слова сюда не кладём - не потому, что их
   нельзя собирать (согласие их перечисляет и они уходят событиями), а
   потому, что для разбора одного отзыва они не нужны. */
function fbContext(){
  var vp = window.visualViewport;
  var w = Math.round(vp ? vp.width : window.innerWidth);
  var h = Math.round(vp ? vp.height : window.innerHeight);
  var c = {
    build: BUILD,
    at: new Date().toISOString(),
    screen: fbWhere(),
    viewport: w + "x" + h,
    dpr: window.devicePixelRatio || 1,
    lang: navigator.language || "",
    reducedMotion: reduced(),
    ua: navigator.userAgent || ""
  };
  try{ c.standalone = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }catch(e){}
  if(S){
    c.round = S.round;
    c.players = S.players.length;
    c.words = S.words.length;
    c.hatLeft = S.hat.length;
    c.turnNo = S.turnNo;
    c.settings = {wordsPerPlayer:S.settings.wordsPerPlayer, turnSeconds:S.settings.turnSeconds};
  }
  return c;
}
/* Экран, с которого написали: если поверх лежала шторка или ростер, важна она,
   а не фаза под ней. */
function fbWhere(){
  var o = byId("o-sheet"), r = byId("o-roster"), f = byId("o-flash");
  if(o && !o.hidden) return "пауза";
  if(r && !r.hidden) return "список игроков";
  if(f && !f.hidden) return "граница раунда";
  return (S && S.phase) || "?";
}

/* Короткое сообщение поверх экрана: используется там, где действие
   завершилось, но показывать целый экран не за чем. */
var toastTimer = null;
function toast(text){
  var area = byId("screenarea");
  if(!area) return;
  var old = byId("toast");
  if(old) old.remove();
  var el = document.createElement("div");
  el.className = "toast"; el.id = "toast"; el.textContent = text;
  area.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if(el.parentNode) el.remove(); }, 2200);
}

/* Системное окно отправки, а если его нет - копируем ссылку в буфер.
   Адрес берём без хвоста: в нём может оказаться ?app или якорь. */
function shareGame(){
  var url = location.origin + location.pathname;
  var data = {title:"Шляпа", text:"Игра в Шляпу: объясняем и угадываем свои слова", url:url};
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
      navigator.share(data).catch(function(){});
      return;
    }
  }catch(e){}
  try{
    navigator.clipboard.writeText(url).then(function(){ toast("Ссылка скопирована"); },
                                           function(){ toast("Не вышло скопировать"); });
  }catch(e){ toast("Не вышло скопировать"); }
}

function openFeedback(){
  if(!fbAvailable()) return;
  kbHide();
  renderFeedback();
  byId("o-fb").hidden = false;
  var t = byId("fb-text");
  if(t) setTimeout(function(){ try{ t.focus(); }catch(e){} }, 80);
}
function closeFeedback(){ kbHide(); byId("o-fb").hidden = true; }

function fbStatus(text, cls){
  var el = byId("fb-status");
  if(!el) return;
  el.className = "fbstatus" + (cls ? " " + cls : "");
  el.textContent = text || "";
}
function fbCount(){
  var t = byId("fb-text"), c = byId("fb-count");
  if(!t || !c) return;
  var left = FB_MAX - t.value.length;
  c.textContent = (left <= FB_COUNT_FROM) ? ("осталось " + left) : "";
}

function renderFeedback(){
  var inner = byId("fb-inner"), draft = fbGet("draft") || "", contact = fbGet("contact") || "";
  var tg = fbTgOn()
    ? '<a class="linkbtn" id="fb-tg" href="' + esc(TELEGRAM_URL) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="tgi">' + IC.tg + '</span>Написать в телеграм</a>'
    : "";

  var rate = '<div><div class="fieldlabel">Как вам игра</div><div class="rate" id="fb-rate">' +
    FB_FACES.map(function(f, i){
      return '<button class="rateb" data-rate="' + (i + 1) + '" aria-pressed="' + (fbRate === i + 1) +
        '" aria-label="' + esc(f.label) + '" title="' + esc(f.label) + '">' + f.face + '</button>';
    }).join("") + '</div></div>';

  var chips = '<div><div class="fieldlabel">На что больше всего похож ваш отзыв</div>' +
    '<div class="chips" id="fb-kind">' +
    FB_KINDS.map(function(k){
      return '<button class="chipb" data-kind="' + esc(k) + '" aria-pressed="' + (fbKind === k) + '">' +
        esc(k) + '</button>';
    }).join("") + '</div></div>';

  var form = fbFormOn()
    ? rate + chips +
      '<div><textarea class="tf ta tfwide" id="fb-text" maxlength="' + FB_MAX + '" ' +
        'placeholder="Расскажите своими словами"></textarea>' +
        '<div class="fbhint"><span></span><span id="fb-count"></span></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
        '<button class="check" id="fb-reach" aria-pressed="' + fbReach + '">' +
          '<span class="box">' + IC.check + '</span>Можно связаться со мной</button>' +
        '<input class="tf tfwide" type="text" id="fb-contact" maxlength="120" autocomplete="off" ' +
          'placeholder="Телеграм или почта" value="' + esc(contact) + '"' +
          (fbReach ? "" : " hidden") + '></div>' +
      /* ловушка для ботов: людям она не видна и всегда пуста */
      '<input id="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true" ' +
        'style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">'
    : '<div class="stub">Форма отзыва ещё не подключена. Напишите напрямую в телеграм.</div>';

  inner.innerHTML =
    '<div class="hdr"><div class="hside">' + hbtn("fb-close", IC.back, "Назад") + '</div>' +
    '<div class="htitle">Обратная связь</div><div class="hside right"></div></div>' +
    '<div class="sheetbody"><div class="pad" style="gap:14px">' + form + '</div></div>' +
    '<div class="pad" style="flex:none;gap:10px">' +
      '<div class="fbstatus" id="fb-status"></div>' +
      (fbFormOn() ? '<ion-button id="fb-send" expand="block">Отправить</ion-button>' : "") +
      tg +
    '</div>';

  byId("fb-close").onclick = closeFeedback;

  inner.querySelectorAll("[data-rate]").forEach(function(b){
    b.onclick = function(){
      var v = +b.dataset.rate;
      fbRate = (fbRate === v) ? 0 : v;     // повторный тап снимает оценку
      buzz(8); fbStatus(""); renderFeedback();
    };
  });
  inner.querySelectorAll("[data-kind]").forEach(function(b){
    b.onclick = function(){
      fbKind = (fbKind === b.dataset.kind) ? "" : b.dataset.kind;
      fbStatus(""); renderFeedback();
    };
  });

  var t = byId("fb-text");
  if(t){
    t.value = draft;
    fbCount();
    t.oninput = function(){ fbCount(); fbSet("draft", t.value); fbStatus(""); };
  }
  var c = byId("fb-contact");
  if(c) c.oninput = function(){ fbSet("contact", c.value); };
  var r = byId("fb-reach");
  if(r) r.onclick = function(){
    fbReach = !fbReach;
    var f = byId("fb-contact");
    if(f){
      f.hidden = !fbReach;
      if(fbReach){ try{ f.focus(); }catch(e){} } else { f.value = ""; fbSet("contact", ""); }
    }
    r.setAttribute("aria-pressed", fbReach);
    requestAnimationFrame(syncSticky);
  };
  var b = byId("fb-send");
  if(b) b.onclick = sendFeedback;
  requestAnimationFrame(syncSticky);
}

function sendFeedback(){
  var t = byId("fb-text"), c = byId("fb-contact"), hp = byId("fb-hp"), b = byId("fb-send");
  if(!t) return;
  if(hp && hp.value){ fbSent(); return; }        // бот заполнил ловушку: молча прощаемся
  var text = t.value.trim();
  /* Одной оценки или категории достаточно: человек не обязан ничего писать,
     чтобы сказать, что игра понравилась. */
  if(!text && !fbRate && !fbKind){ fbStatus("Поставьте оценку или напишите пару слов", "bad"); return; }
  if(text && text.length < FB_MIN){ fbStatus("Слишком коротко", "bad"); try{ t.focus(); }catch(e){} return; }

  var last = +(fbGet("last") || 0);
  var wait = Math.ceil((FB_COOLDOWN_MS - (Date.now() - last)) / 1000);
  if(wait > 0){ fbStatus("Отзыв только что ушёл, подождите " + num(wait,"секунду","секунды","секунд"), "bad"); return; }

  kbHide();
  b.disabled = true;
  fbStatus("Отправляем...");

  var ctrl = null, timer = null;
  try{ ctrl = new AbortController(); }catch(e){}
  if(ctrl) timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, FB_TIMEOUT_MS);

  fetch(FEEDBACK_URL, {
    method: "POST", mode: "cors", headers: {"content-type": "application/json"},
    body: JSON.stringify({
      text: text,
      rate: fbRate || null,
      kind: fbKind || "",
      contact: (fbReach && c) ? c.value.trim().slice(0,120) : "",
      ctx: fbContext()
    }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    if(timer) clearTimeout(timer);
    fbSent();
  }).catch(function(){
    if(timer) clearTimeout(timer);
    b.disabled = false;
    /* Текст не стираем и черновик не трогаем: отправить не вышло,
       человек должен иметь возможность скопировать написанное в телеграм. */
    fbStatus(fbTgOn() ? "Не отправилось. Попробуйте ещё раз или напишите в телеграм"
                      : "Не отправилось. Попробуйте ещё раз позже", "bad");
  });
}
function fbSent(){
  track("feedback_sent", {rate:fbRate||0, kind:fbKind||"", screen:fbWhere()});
  anGoal("feedback_sent");
  fbSet("last", String(Date.now()));
  fbDel("draft");
  fbRate = 0; fbKind = ""; fbReach = false;
  fbSet("contact", "");
  renderFeedback();
  fbStatus("Спасибо, отзыв ушёл", "ok");
  buzz(12);
}

/* ============================================================
   АНАЛИТИКА: хранилище, согласие, отправка
   ============================================================ */
function anRead(){
  try{ var r=localStorage.getItem(AN_STORE); return r ? (JSON.parse(r)||{}) : {}; }catch(e){ return {}; }
}
function anPatch(o){
  var d=anRead();
  for(var k in o) if(Object.prototype.hasOwnProperty.call(o,k)) d[k]=o[k];
  try{ localStorage.setItem(AN_STORE, JSON.stringify(d)); }catch(e){}
  return d;
}
function anOn(){ return AN.ok === true; }

/* Один раз на устройство: спрашиваем всё сразу и больше не возвращаемся.
   До ответа не уходит ничего и счётчик не грузится. */
function anInit(){
  var d = anRead(), now = Date.now(), first = !d.install;
  if(first) d.install = uid() + uid();

  var fresh = (!d.sit || !d.seen || (now - d.seen) > AN_SIT_GAP_MS);
  if(fresh) d.sit = uid() + uid();

  AN.install = d.install;
  AN.sit = d.sit;
  AN.ok = (d.ok === true) ? true : ((d.ok === false) ? false : null);
  AN.q = Array.isArray(d.q) ? d.q.slice(-AN_MAX) : [];
  AN.tail = [];

  /* Партия, начатая в прошлый раз и не дошедшая до финала. Засчитываем её
     брошенной только если компания в тот вечер уже не вернулась. */
  var lost = (fresh && d.open && d.open.game) ? d.open : null;

  anPatch({install:d.install, sit:d.sit, seen:now, q:AN.q, open:lost ? null : (d.open||null)});

  if(AN.ok === true) anStart(first, lost);
  else if(AN.ok === null) AN._pending = {first: !!first, lost: lost || null};
}

function anStart(first, lost){
  anMetrika();
  var vp = window.visualViewport;
  track("app_open", {
    first: !!first,
    vw: Math.round(vp ? vp.width : window.innerWidth),
    vh: Math.round(vp ? vp.height : window.innerHeight),
    dpr: window.devicePixelRatio || 1,
    lang: navigator.language || "",
    reduced: reduced(),
    standalone: anStandalone(),
    ref: document.referrer || ""
  });
  if(lost) track("game_abandoned", lost);
  anFlush(false);
}
function anStandalone(){
  try{ return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }catch(e){ return false; }
}

function track(name, props){
  if(!anOn()) return;
  var e = {at: Date.now(), n: name, p: props || {}};
  if(AN.game) e.g = AN.game;
  AN.q.push(e);
  if(AN.q.length > AN_MAX) AN.q = AN.q.slice(-AN_MAX);

  AN.tail.push(name);
  if(AN.tail.length > AN_TAIL) AN.tail.shift();

  /* Слепок незакрытой партии: если приложение больше не откроют в этот
     вечер, он уедет следующим запуском как game_abandoned. */
  var open = null;
  if(AN.game && S){
    open = {game:AN.game, phase:S.phase, turnNo:S.turnNo, round:S.round,
      players:S.players.length, words:S.words.length, tail:AN.tail.slice()};
  }
  anPatch({q:AN.q, seen:e.at, open:open});
  anSchedule();
}

function anSchedule(){
  if(AN.timer || !EVENTS_URL || !AN.q.length) return;
  AN.timer = setTimeout(function(){ AN.timer = null; anFlush(false); }, AN_FLUSH_MS);
}

/* beacon уходит на выгрузке вкладки: там уже нельзя ждать ответ.
   Тип text/plain выбран намеренно - с application/json браузер сначала
   спросил бы разрешение отдельным запросом, а beacon так не умеет. */
function anFlush(beacon){
  if(!EVENTS_URL || !anOn() || !AN.q.length || AN.sending) return;
  var batch = AN.q.slice(0, AN_BATCH), n = batch.length;
  var body = JSON.stringify({
    install: AN.install, sit: AN.sit, build: BUILD,
    ua: navigator.userAgent || "", events: batch
  });

  if(beacon){
    try{
      var blob = new Blob([body], {type:"text/plain;charset=UTF-8"});
      if(navigator.sendBeacon && navigator.sendBeacon(EVENTS_URL, blob)){
        AN.q = AN.q.slice(n); anPatch({q:AN.q});
      }
    }catch(e){}
    return;
  }

  AN.sending = true;
  fetch(EVENTS_URL, {
    method:"POST", mode:"cors", headers:{"content-type":"application/json"},
    body: body, keepalive: true
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    AN.q = AN.q.slice(n); anPatch({q:AN.q});
  }).catch(function(){
    /* Молча: не отправилось - полежит до следующего раза */
  }).then(function(){
    AN.sending = false;
    if(AN.q.length) anSchedule();
  });
}

function anMetrika(){
  if(!METRIKA_ID || window.ym) return;
  try{
    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for(var j=0;j<e.scripts.length;j++){ if(e.scripts[j].src===r) return; }
      k=e.createElement(t);a=e.getElementsByTagName(t)[0];k.async=1;k.src=r;a.parentNode.insertBefore(k,a);
    })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js?id=" + METRIKA_ID, "ym");
    window.ym(METRIKA_ID, "init", {
      ssr:true, webvisor:true, clickmap:true,
      accurateTrackBounce:true, trackLinks:true
    });
  }catch(e){}
}

/* Метрика строит карты кликов и скроллинга по адресу страницы, а у нас всё
   приложение живёт на одном адресе. Без виртуальных просмотров карты всех
   экранов слились бы в одну кашу, и воронка тоже не построилась бы. */
function anHit(name){
  if(!METRIKA_ID || !window.ym) return;
  try{
    var base = location.pathname.replace(/\/+$/, "");
    window.ym(METRIKA_ID, "hit", location.origin + base + "/" + name, {title:name});
  }catch(e){}
}
function anGoal(name){
  if(!METRIKA_ID || !window.ym) return;
  try{ window.ym(METRIKA_ID, "reachGoal", name); }catch(e){}
}

/* ---------- согласие ---------- */
/* Один вопрос на устройство, при первом открытии, и он перечисляет весь
   состав сразу. Дробить на несколько согласий нельзя: каждое следующее
   окно люди закрывают не читая, и толку от него нет никому. */
function anAsk(){
  var inner = byId("consent-inner");
  if(!inner) return;
  /* Формулировка по сложившемуся образцу, а не своя: что собираем, зачем,
     кто обрабатывает, ссылка на политику, два равнозначных действия.
     Категорий здесь одна - аналитика, поэтому кнопки "Настроить" нет:
     настраивать в ней было бы нечего. */
  /* Ссылка вшита в саму фразу, а не висит отдельной строкой: так она
     читается как часть объяснения, а не как мелкий шрифт под кнопками. */
  var about = PRIVACY_URL
    ? 'Подробнее в <a href="'+PRIVACY_URL+'" target="_blank" rel="noopener">'+
      'политике обработки данных</a>'
    : "";
  inner.innerHTML =
    '<div class="cbox">'+
      '<div class="ct">Игра использует cookie</div>'+
      '<p class="cp">Мы собираем статистику о том, как проходят партии, чтобы '+
        'делать игру удобнее и интереснее. '+ about +'</p>'+
      '<div class="cbtns">'+
        '<button class="cbtn cyes" id="cons-yes">Принять</button>'+
        '<button class="cbtn cno" id="cons-no">Отклонить</button>'+
      '</div>'+
    '</div>';
  byId("cons-yes").onclick = function(){ anAnswer(true); };
  byId("cons-no").onclick = function(){ anAnswer(false); };
}

/* Спрашиваем только на главной: это единственный экран, где человек ничего
   не делает и может прочитать. Во время настройки, ввода слов и тем более
   хода баннер был бы помехой посреди дела. Ушли с главной не ответив -
   баннер уходит вместе с экраном и ждёт следующего возвращения. */
function anGate(){
  var el = byId("o-consent");
  if(!el) return;
  var want = (AN.ok === null && S && S.phase === "home" && (EVENTS_URL || METRIKA_ID));
  if(want === !el.hidden) return;
  if(want){
    anAsk();
    el.hidden = false;
    byId("app").classList.add("consenting");
    anMeasure();
    window.addEventListener("resize", anMeasure);
  } else {
    el.hidden = true;
    byId("app").classList.remove("consenting");
    window.removeEventListener("resize", anMeasure);
  }
}
/* Высота баннера вместе с отступом: её занимает нижний край экрана */
function anMeasure(){
  var box = document.querySelector("#o-consent .cbox");
  if(!box) return;
  /* Запас поверх высоты карточки: нижняя кнопка экрана должна встать выше
     плотной части градиента, а не в неё. */
  document.documentElement.style.setProperty("--conh", Math.ceil(box.offsetHeight + 34) + "px");
  requestAnimationFrame(syncSticky);
}
function anAnswer(ok){
  anPatch({ok: !!ok});
  AN.ok = !!ok;
  var p = AN._pending || {};
  AN._pending = null;
  anGate();
  requestAnimationFrame(syncSticky);
  if(ok){
    anStart(p.first, p.lost);
    track("consent", {ok:true});
  }
  if(AN._after){ var f = AN._after; AN._after = null; f(); }
}
/* Отзыв согласия. Пока не вызывается ниоткуда: переключатель переедет в
   раздел настроек, когда он появится. До тех пор отозвать можно очисткой
   данных сайта - вопрос тогда задаётся заново. Так написано и в политике. */
function anRevoke(){
  anPatch({ok:false, q:[], open:null});
  AN.ok = false; AN.q = [];
}

/* ============================================================
   ИГРА
   ============================================================ */
function beginGame(){
  kbHide();
  /* Последний игрок жмёт "Начать партию", а не "Передать", поэтому его
     время ввода нужно закрыть здесь - иначе в данных не хватало бы ровно
     того игрока, на котором компания обычно и устаёт. */
  track("entry_player_done", {pi:S.entryIndex, ms:Date.now()-(S._entryStart||Date.now()), last:true});
  AN.game = uid() + uid();
  track("game_started", {
    players: S.players.length,
    words: S.words.length,
    wordsPerPlayer: S.settings.wordsPerPlayer,
    turnSeconds: S.settings.turnSeconds,
    setupMs: Date.now() - (S.createdAt || Date.now())
  });
  anGoal("game_started");
  S.order=S.players.map(function(p){ return p.id; });
  S.lap=1; S.idx=0; S.round=1; S.round3Turns=0;
  S.hat=shuffle(allIds());
  S.log=[]; S.turnNo=0; S.carryMs=null; S.turn=null;
  S.phase="handoff";
  go();
}
function currentPair(){
  var n=S.order.length;
  return { ex:S.order[S.idx%n], gu:S.order[(S.idx+1)%n] };
}
function renderHandoff(){
  var el=byId("s-handoff"), pr=currentPair(), r=ROUNDS[S.round];
  el.innerHTML =
    '<div class="center">'+
      '<div class="who">'+esc(pname(pr.ex))+'</div><div class="role">объясняет</div>'+
      '<div class="between">'+IC.down+'</div>'+
      '<div class="who">'+esc(pname(pr.gu))+'</div><div class="role">угадывает</div>'+
      '<div style="height:18px"></div>'+
      '<div class="note" style="text-align:left">'+esc(r.rule)+'<br>'+num(secsLeft(),"секунда","секунды","секунд")+'</div>'+
      '<div style="height:18px"></div>'+
      '<ion-button id="startturn" style="min-width:210px">Начать ход</ion-button>'+
    '</div>';
  byId("startturn").onclick=startTurn;
}
function startTurn(){
  unlockAudio(); wakeOn();
  var pr=currentPair();
  S.turnNo++;
  S.turn={no:S.turnNo, ex:pr.ex, gu:pr.gu, startRound:S.round,
    remainingMs:(S.carryMs!==null?S.carryMs:S.settings.turnSeconds*1000),
    startMs:S.settings.turnSeconds*1000, items:[], current:null, streak:0};
  S.carryMs=null;
  track("turn_started", {no:S.turnNo, round:S.round, ms:S.turn.remainingMs,
    carry:S.turn.remainingMs !== S.settings.turnSeconds*1000, hat:S.hat.length});
  // Предыдущая пара могла разобрать шляпу до дна: для новой пары свободны все слова
  if(S.round===3 && !S.hat.length) S.hat=round3Refill();
  drawWord();
  S.wordShownAt=Date.now();
  S.phase="turn";
  go();
  runTimer();
}
function drawWord(){ S.turn.current = S.hat.length ? S.hat.shift() : null; }

/* стопка под карточкой тает вместе со шляпой: 3, 2, 1, пусто */
function stackHTML(){
  var n = Math.min(3, S.hat.length), out = "";
  for(var i=n;i>=1;i--) out += '<div class="ghost g'+i+'"></div>';
  return out;
}
function paintStack(){
  var st = byId("stack");
  if(st) st.innerHTML = stackHTML();
}

function renderTurn(){
  var el=byId("s-turn");
  var got=S.turn.items.filter(function(i){ return i.guessed; }).length;
  el.innerHTML =
    '<div class="turnwrap">'+
      '<div class="turnhead">'+pairBox(S.turn.ex, S.turn.gu)+
        '<div class="clock" id="clock">0:00</div></div>'+
      '<div class="cardzone" id="cardzone">'+
        '<canvas id="conf"></canvas>'+
        '<div id="stack">'+stackHTML()+'</div>'+
        '<div class="card" id="card">'+
          '<div class="word" id="wordbox">'+esc(wtext(S.turn.current))+'</div>'+
          '<div class="swipehint">'+IC.up+'<span>свайп вверх</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="turnfoot">'+
        '<div class="fmt">угадано <b id="gotn">'+got+'</b></div>'+
        '<ion-button id="gotbtn">Засчитать</ion-button>'+
      '</div>'+
    '</div>';
  byId("gotbtn").onclick=flyOut;
  bindSwipe(byId("card"));
  paintClock();
}
function bindSwipe(card){
  if(!card) return;
  var y0=null,t0=0,active=false;
  card.addEventListener("pointerdown", function(e){
    if(e.target.closest("ion-button,button")) return;
    active=true; y0=e.clientY; t0=Date.now();
    card.classList.add("dragging");
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  card.addEventListener("pointermove", function(e){
    if(!active) return;
    var dy=Math.min(0,e.clientY-y0);
    card.style.transform="translateY("+dy+"px) rotate("+(dy/70)+"deg)";
    card.style.opacity=String(Math.max(.3,1+dy/340));
  });
  function release(e){
    if(!active) return;
    active=false;
    card.classList.remove("dragging");
    var dy=(e&&typeof e.clientY==="number"?e.clientY:y0)-y0;
    card.style.transform=""; card.style.opacity="";
    var ok = (dy<-55 && (Date.now()-t0)<1200);
    /* Потянули и не дотянули: во втором раунде руки заняты жестами, и
       именно здесь теряются секунды. Сорванные попытки считаем отдельно. */
    if(!ok && dy < -8) track("swipe_aborted", {round:S.round, dy:Math.round(dy), ms:Date.now()-t0});
    if(ok) flyOut();
  }
  card.addEventListener("pointerup",release);
  card.addEventListener("pointercancel",release);
  card.addEventListener("pointerleave",release);
}
function flyOut(){
  if(swiping || S.phase!=="turn" || !S.turn || !S.turn.current) return;
  swiping=true;
  buzz(12);
  confettiBurst();
  floatPlusOne();
  var z=byId("cardzone");
  if(z && !reduced()){
    z.classList.remove("hit"); void z.offsetWidth; z.classList.add("hit");
  }
  var c=byId("card");
  if(!c){ swiping=false; markGuessed(); return; }
  c.classList.add("gone");
  setTimeout(function(){
    var cc=byId("card"); if(cc) cc.classList.remove("gone");
    swiping=false;
    markGuessed();
  },170);
}
document.addEventListener("keydown", function(e){
  if(S && S.phase==="turn" && (e.code==="Space"||e.code==="ArrowUp")){ e.preventDefault(); flyOut(); }
});

/* Третий раунд длится фиксированное число ходов, а не до последнего слова,
   поэтому опустевшая шляпа в нём пополняется. Возвращаем в неё только те слова,
   которых пара ещё не касалась в этом раунде: дважды отгадать одно и то же
   слово нельзя, и больше слов, чем есть в игре, пара за ход не наберёт. */
function round3Refill(){
  var played={};
  if(S.turn) S.turn.items.forEach(function(i){ if(i.round===3) played[i.wordId]=true; });
  return shuffle(allIds().filter(function(id){ return !played[id]; }));
}
/* Пара разобрала все слова до конца времени: предъявлять больше нечего,
   ход закрывается досрочно. */
function hatEmptied(){
  stopTimer();
  buzz([60,40,60]);
  endTurn();
}
function markGuessed(){
  if(S.phase!=="turn" || !S.turn || !S.turn.current) return;
  var gap = Date.now() - (S.wordShownAt || Date.now());
  S.turn.streak = (gap < 8000) ? (S.turn.streak+1) : 1;
  S.turn.items.push({wordId:S.turn.current, guessed:true, round:S.round, ms:gap});
  track("word_guessed", {round:S.round, ms:gap, streak:S.turn.streak,
    after: !!S._afterBoundary, no:S.turn.no});
  S._afterBoundary = false;
  S.turn.current=null;

  ping(S.turn.streak);
  popCounter();
  if(S.turn.streak>=3) showStreak(S.turn.streak);

  if(S.hat.length===0){
    if(S.round<3){ roundBoundary(); return; }
    S.hat=round3Refill();
    if(!S.hat.length){ hatEmptied(); return; }
  }
  drawWord();
  S.wordShownAt=Date.now();
  var wb=byId("wordbox"); if(wb) wb.textContent=wtext(S.turn.current);
  var gn=byId("gotn"); if(gn) gn.textContent=S.turn.items.filter(function(i){ return i.guessed; }).length;
  paintStack();
  renderCtx(); save();
}

/* Граница раунда: игра встаёт на паузу и ждёт явного действия.
   Автопродолжение через таймаут не давало паре понять, что правила сменились. */
function roundBoundary(){
  stopTimer(); wakeOff();
  var frozen = S.turn.remainingMs;
  track("boundary_shown", {to:S.round+1, frozenMs:frozen, no:S.turn.no});
  S._boundaryAt = Date.now();
  S.round++;
  S.hat = shuffle(allIds());
  var r = ROUNDS[S.round];
  buzz([60,50,60]);
  beep();

  byId("flash-inner").innerHTML =
    '<div class="eyebrow">Шляпа опустела, таймер остановлен</div>'+
    '<div class="big" style="margin-top:2px">Раунд '+r.n+': '+esc(r.name)+'</div>'+
    '<p style="max-width:275px;margin-top:2px">'+esc(r.rule)+'</p>'+
    '<div class="lastgame" style="margin-top:18px;max-width:290px;width:100%;align-items:center;text-align:center">'+
      '<div class="lt">Ход продолжается</div>'+
      '<div style="font-size:16px;font-weight:700;display:flex;justify-content:center">'+
        pairBox(S.turn.ex, S.turn.gu)+'</div>'+
      '<div class="lw">осталось '+num(Math.ceil(frozen/1000),"секунда","секунды","секунд")+'</div>'+
    '</div>'+
    '<div style="height:20px"></div>'+
    '<ion-button id="fl-go" style="min-width:230px">'+
      '<span style="display:inline-flex;align-items:center;gap:8px">'+
      '<span style="width:16px;height:16px;display:block">'+IC.play+'</span>Продолжить ход</span></ion-button>';

  byId("o-flash").hidden = false;
  byId("fl-go").onclick = resumeAfterBoundary;
  renderBar(); renderCtx(); renderProgress(); save();
}

function resumeAfterBoundary(){
  /* Сколько держали оверлей: если закрывают за секунду, его не прочитали */
  track("boundary_resumed", {round:S.round, ms:Date.now()-(S._boundaryAt||Date.now())});
  S._afterBoundary = true;
  byId("o-flash").hidden = true;
  drawWord();
  S.wordShownAt = Date.now();
  S.turn.streak = 0;
  renderTurn(); renderBar(); renderCtx();
  wakeOn();
  runTimer();
}

function runTimer(){ stopTimer(); lastTick=Date.now(); tick(); }
function tick(){
  var now=Date.now();
  S.turn.remainingMs-=(now-lastTick);
  lastTick=now;
  if(S.turn.remainingMs<=0){
    S.turn.remainingMs=0; paintClock(); stopTimer(); beep(); buzz([140,70,140]); endTurn(); return;
  }
  paintClock();
  timerRaf=requestAnimationFrame(tick);
}
function stopTimer(){ if(timerRaf){ cancelAnimationFrame(timerRaf); timerRaf=null; } }
function paintClock(){
  var c=byId("clock");
  if(!c||!S.turn) return;
  var s=Math.ceil(Math.max(0,S.turn.remainingMs)/1000);
  c.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  c.className="clock"+(s<=10?" low":"");
  renderProgress();
}
function endTurn(){
  wakeOff();
  if(S.turn.current){
    var w=word(S.turn.current); if(w) w.returns++;
    S.turn.items.push({wordId:S.turn.current, guessed:false, round:S.round, ms:null});
    S.hat.push(S.turn.current);
    S.hat=shuffle(S.hat);
    S.turn.current=null;
  }
  S.log.push({no:S.turn.no, ex:S.turn.ex, gu:S.turn.gu,
    startRound:S.turn.startRound, endRound:S.round, items:S.turn.items.slice()});
  track("turn_ended", {
    no:S.turn.no, round:S.round, startRound:S.turn.startRound,
    got:S.turn.items.filter(function(i){ return i.guessed; }).length,
    missed:S.turn.items.filter(function(i){ return !i.guessed; }).length,
    reason: S.turn.remainingMs > 0 ? "hat" : "time",
    exIdx: S.order.indexOf(S.turn.ex), guIdx: S.order.indexOf(S.turn.gu)
  });
  S.turn = null;          // иначе secsLeft() потом отдаёт 0 на экране передачи
  S.phase="review";
  go();
}

function radarSVG(){
  var order=S.players, n=order.length;
  if(n<3) return "";
  var m={}; scores().forEach(function(s){ m[s.id]=s.pts; });
  var max=Math.max(1, Math.max.apply(null, order.map(function(p){ return m[p.id]||0; })));
  var W=250,H=210,cx=W/2,cy=H/2+4,R=62,parts=[],labels=[];
  function pt(i,f){ var a=-Math.PI/2+i*(2*Math.PI/n); return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; }
  [1/3,2/3,1].forEach(function(f){
    var d=order.map(function(_,i){ var p=pt(i,f); return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
    parts.push('<polygon points="'+d+'" fill="none" stroke="#CAD2DE" stroke-width="1"'+(f===1?'':' stroke-dasharray="2 3"')+'/>');
  });
  order.forEach(function(_,i){
    var p=pt(i,1);
    parts.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#CAD2DE" stroke-width="1"/>');
  });
  var poly=order.map(function(p,i){ var q=pt(i,(m[p.id]||0)/max); return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" ");
  parts.push('<defs><linearGradient id="rgrad" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#5AA9F7" stop-opacity=".52"/>'+
    '<stop offset="100%" stop-color="#1F6FEB" stop-opacity=".12"/></linearGradient></defs>');
  parts.push('<polygon class="radarpoly" points="'+poly+'" fill="url(#rgrad)" stroke="#1F6FEB" '+
    'stroke-width="2.2" stroke-linejoin="round"/>');
  order.forEach(function(p,i){
    var q=pt(i,(m[p.id]||0)/max);
    parts.push('<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="#1F6FEB" stroke="#FAFCFF" stroke-width="2"/>');
    var lp=pt(i,1.30), a=-Math.PI/2+i*(2*Math.PI/n), cos=Math.cos(a);
    var anchor=cos>0.25?"start":(cos<-0.25?"end":"middle");
    labels.push('<text x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="'+anchor+'" font-family="Archivo, sans-serif" font-size="10.5" font-weight="600" fill="#141820">'+esc(p.name)+'</text>'+
      '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+11).toFixed(1)+'" text-anchor="'+anchor+'" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A6472">'+(m[p.id]||0)+'</text>');
  });
  parts.push('<text x="'+(cx+3)+'" y="'+(cy-R+1)+'" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#8A94A4">'+max+'</text>');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:250px" role="img" aria-label="Очки игроков">'+parts.join("")+labels.join("")+'</svg>';
}

/* ------------------------------------------------------------
   Эмоциональная реакция на ход. Строка выбирается по номеру хода,
   чтобы не прыгала при перерисовке от правки отметок.
   ------------------------------------------------------------ */
/* Формулировки без привязки к роду: никаких «смог», «сыграла» и прочего,
   что пришлось бы угадывать по имени. */
var MOOD = {
  zero:[
    "Ни одного. Шляпа сегодня держит оборону.",
    "Пусто. Иногда слова просто не хотят.",
    "Ноль. Зато следующий ход с чистого листа.",
    "Мимо. У чемпионов тоже бывают такие минуты.",
    "Ничего. Зато сколько эмоций.",
    "Не зашло. Слова подождут, они терпеливые.",
    "Глухо. Но шляпа-то никуда не денется.",
    "Ноль слов и целая минута жизни. Красиво."
  ],
  own:[
    "Собственное слово, и мимо. Грабли своего производства.",
    "У {n} не вышло объяснить своё же слово. Вот это ирония.",
    "Слово придумал {n}. Слово же и не далось.",
    "Своё не поддалось. Шляпа злопамятна.",
    "Автор слова - {n}. Автор на нём и застрял.",
    "Придумать было легче, чем объяснить. Правда, {n}?",
    "Написать - одно, объяснить - совсем другое.",
    "{n}, это было ваше слово. Просто напоминаем."
  ],
  record:[
    "Рекорд партии. Кто рискнёт переплюнуть?",
    "Лучший ход за вечер. Планка поднята.",
    "Ух ты. Остальным теперь есть куда стремиться.",
    "Новый максимум. Аплодисменты.",
    "Так ещё никто не делал. Пока.",
    "Рекорд. Скриньте, потом не поверят.",
    "Верхняя строчка теперь ваша. Ненадолго?",
    "Это будет сложно повторить."
  ],
  clean:[
    "Ни одного промаха. Идеально.",
    "Чисто. Ни одно слово не вернулось в шляпу.",
    "Без потерь. Красиво.",
    "Ни единой осечки. Так и надо."
  ],
  great:[
    "С полуслова. Так и надо.",
    "Мощно. Шляпа заметно похудела.",
    "Вот это сыгранность.",
    "Темп высокий, слова не успевают.",
    "Шляпа не ожидала такого напора.",
    "Отличный заход. Остальные напряглись.",
    "Кажется, вы двое репетировали."
  ],
  good:[
    "Крепко сыграно.",
    "Хороший темп, без провалов.",
    "Ровный ход. Надёжно.",
    "Достойно. Так держать.",
    "Спокойно и уверенно.",
    "Нормальный улов."
  ],
  ok:[
    "Начало положено.",
    "По чуть-чуть тоже считается.",
    "Немного, но в копилку.",
    "Скромно, зато честно.",
    "Один шаг - тоже шаг.",
    "Лиха беда начало."
  ]
};
function bestBefore(no){
  var m = 0;
  S.log.forEach(function(t){
    if(t.no >= no) return;
    var g = t.items.filter(function(i){ return i.guessed; }).length;
    if(g > m) m = g;
  });
  return m;
}
function reviewMood(t, got){
  // разброс, чтобы соседние ходы не шли по списку подряд
  function pick(arr){ return arr[(t.no*7 + got*3) % arr.length]; }
  function own(){ return {cls:"joke", ic:IC.rake, text:pick(MOOD.own).replace(/\{n\}/g, esc(pname(t.ex)))}; }

  var ownMiss = false, misses = 0;
  t.items.forEach(function(it){
    if(it.guessed) return;
    misses++;
    var w = word(it.wordId);
    if(w && w.authorId === t.ex) ownMiss = true;
  });

  if(got === 0) return ownMiss ? own() : {cls:"soft", ic:IC.smile, text:pick(MOOD.zero)};
  if(got >= 3 && got > bestBefore(t.no)) return {cls:"wow", ic:IC.star, text:pick(MOOD.record)};
  if(ownMiss) return own();
  if(got >= 3 && misses === 0) return {cls:"wow", ic:IC.star, text:pick(MOOD.clean)};
  if(got >= 5) return {cls:"good", ic:IC.check, text:pick(MOOD.great)};
  if(got >= 3) return {cls:"good", ic:IC.check, text:pick(MOOD.good)};
  return {cls:"soft", ic:IC.smile, text:pick(MOOD.ok)};
}

function renderReview(){
  var el=byId("s-review"), t=S.log[S.log.length-1];
  if(!t){ S.phase="handoff"; go(); return; }
  var got=t.items.filter(function(i){ return i.guessed; }).length;
  var last=(S.round===3)&&(S.round3Turns+1>=S.players.length);
  var mood=reviewMood(t, got);
  el.innerHTML =
    '<div class="pad">'+
      '<div>'+pairBox(t.ex,t.gu,"")+
      '<h1 style="margin-top:4px">'+num(got,"слово","слова","слов")+' угадано</h1></div>'+
      '<div class="mood '+mood.cls+'"><span class="mi">'+mood.ic+'</span>'+
        '<span class="mt">'+mood.text+'</span></div>'+
      (t.items.length ? '<div>'+t.items.map(function(it,i){
          return '<button class="wrow" data-i="'+i+'" data-on="'+(it.guessed?1:0)+'">'+
            '<span class="mark">'+IC.check+'</span>'+
            '<span class="wt">'+esc(wtext(it.wordId))+'</span>'+
            (t.startRound!==t.endRound?'<span class="rd">Р'+it.round+'</span>':'')+'</button>';
        }).join("")+'</div>' : '<div class="stub">За ход не сыграно ни одного слова</div>')+
      (t.startRound!==t.endRound
        ? '<div class="note">Ход прошёл через границу раунда: начался в '+t.startRound+', закончился в '+t.endRound+'.</div>' : '')+
      '<div class="radarwrap"><div class="radarcap">расклад очков</div>'+radarSVG()+'</div>'+
      '<div class="spacer"></div>'+
      '<div class="actions"><ion-button id="rnext" expand="block">'+
        (last?"Посмотреть результаты":"Начать следующий ход")+'</ion-button></div>'+
    '</div>';
  el.querySelectorAll(".wrow").forEach(function(b){
    b.onclick=function(){ t.items[+b.dataset.i].guessed=!t.items[+b.dataset.i].guessed; go(); };
  });
  byId("rnext").onclick=advance;
}

function advanceState(){
  var n=S.order.length;
  if(S.round===3) S.round3Turns++;
  if(S.round===3 && S.round3Turns>=S.players.length) return true;
  S.idx++;
  if(S.idx>=n){
    S.idx=0; S.lap++;
    if(S.round!==3) S.order=nextOrder(S.order);
  }
  return false;
}
function advance(){
  if(advanceState()){ finish(); return; }
  S.phase="handoff";
  go();
}

/* ---------- журнал ---------- */
function journalHTML(){
  var rev=S.log.slice().reverse(), out="", cur=null;
  rev.forEach(function(t){
    if(t.endRound!==cur){
      cur=t.endRound;
      out+='<div class="rdiv"><span>Раунд '+cur+' · '+esc(ROUNDS[cur].name)+'</span></div>';
    }
    var g=t.items.filter(function(i){ return i.guessed; }).length;
    var open=(S.openAcc && S.openAcc["t"+t.no])?"1":"0";

function scores(){
  var m={};
  S.players.forEach(function(p){ m[p.id]=0; });
  S.log.forEach(function(t){
    t.items.forEach(function(it){
      if(!it.guessed) return;
      if(m[t.ex]!==undefined) m[t.ex]++;
      if(m[t.gu]!==undefined) m[t.gu]++;
    });
  });
  return S.players.map(function(p){ return {id:p.id,name:p.name,pts:m[p.id]}; })
    .sort(function(a,b){ return b.pts-a.pts; });
}
function stats(){
  var pairs={},hardest=null,fastest=null,byAuthor={};
  S.log.forEach(function(t){
    var key=t.ex<t.gu?t.ex+"|"+t.gu:t.gu+"|"+t.ex;
    if(!pairs[key]) pairs[key]={a:t.ex,b:t.gu,n:0};
    t.items.forEach(function(it){
      if(!it.guessed) return;
      pairs[key].n++;
      if(it.ms!==null && (!fastest||it.ms<fastest.ms)) fastest={ms:it.ms,wordId:it.wordId,gu:t.gu};
    });
  });
  S.words.forEach(function(w){
    if(!hardest||w.returns>hardest.returns) hardest=w;
    if(!byAuthor[w.authorId]) byAuthor[w.authorId]={ret:0,n:0};
    byAuthor[w.authorId].ret+=w.returns;
    byAuthor[w.authorId].n++;
  });
  var bestPair=null;
  Object.keys(pairs).forEach(function(k){ if(!bestPair||pairs[k].n>bestPair.n) bestPair=pairs[k]; });
  var tough=null;
  Object.keys(byAuthor).forEach(function(id){
    var avg=byAuthor[id].ret/Math.max(1,byAuthor[id].n);
    if(!tough||avg>tough.avg) tough={id:id,avg:avg};
  });
  return {bestPair:bestPair,hardest:hardest,fastest:fastest,tough:tough};
}

/* титулы в виде готовых строк: история не должна зависеть от id игроков */

  var st=stats(), out={};
  if(st.bestPair) out.bestPair={v:pname(st.bestPair.a)+" и "+pname(st.bestPair.b),
    d:num(st.bestPair.n,"слово","слова","слов")+" на двоих за партию"};
  if(st.hardest && st.hardest.returns>0) out.hardest={v:st.hardest.text,
    d:"возвращалось в шляпу "+num(st.hardest.returns,"раз","раза","раз")};
  if(st.tough && st.tough.avg>0) out.tough={v:pname(st.tough.id),
    d:"слова возвращались чаще всех, в среднем "+dec(st.tough.avg)};
  if(st.fastest) out.fastest={v:wtext(st.fastest.wordId),
    d:pname(st.fastest.gu)+" · "+dec(st.fastest.ms/1000)+" с"};
  return out;
}

function go(){
  Object.keys(SCREENS).forEach(function(k){ byId(SCREENS[k][0]).hidden=(k!==S.phase); });
  var def=SCREENS[S.phase];
  if(def) def[1]();

  /* Анимация входа проигрывается только при смене экрана. go() вызывается и
     на перерисовку внутри экрана - тап по переключателю слов или секунд,
     добавление игрока, перетаскивание в списке, - и там она читается как
     рывок страницы: содержимое каждый раз заново съезжает на 9 пикселей. */
  var node = def ? byId(def[0]) : null;
  if(node && !reduced() && S.phase !== paintedPhase){
    node.classList.remove("enter"); void node.offsetWidth; node.classList.add("enter");
  }
  paintedPhase = S.phase;

  var playing = ["handoff","turn","review"].indexOf(S.phase) >= 0;
  var lit = playing || S.phase === "home";
  byId("app").classList.toggle("playing", playing);
  byId("app").classList.toggle("calm", !playing);
  dotsOn(lit);
  if(S.phase !== "home"){ clearInterval(hatTimer); hatTimer = null; }
  if(S.phase !== "entry") stopHints();

  if(S.phase !== AN.phase){
    AN.phase = S.phase;
    anHit(S.phase);
    track("screen", {n:S.phase});
  }
  anGate();

  renderBar(); renderCtx(); renderProgress(); renderDev(); save();
  requestAnimationFrame(syncSticky);
}

    thumb.style.height=h+"px";

/* ====================== СВЕТЯЩИЕСЯ ТОЧКИ ======================
   По полю точек медленно ходят пятна света. Точка внутри пятна становится
   крупнее, ярче и меняет цвет по ленте «голубой → синий → фиолетовый»;
   снаружи остаётся такой же, какой была до 0.9. Характер движения пятен
   выбирается случайно при запуске из четырёх: мягкие пятна, дыхание, живые
   кляксы, волна наискось.

   Почему холст, а не CSS. Пятно меняет каждую точку по отдельности —
   слоем целиком это не нарисовать, а тысяча DOM-узлов с анимацией телефон
   не потянет. Холст перерисовывает всё разом.

   Чего это стоит. Около тысячи точек на кадр при 30 кадрах в секунду.
   Дорогое здесь — не рисование, а склейка строк цвета, поэтому кисти
   посчитаны заранее (LUT), а точки одного оттенка рисуются одной заливкой. */
var DOT_GRID = 20;
/* Точка вне светящегося пятна — такая же, какой была до 0.9. */
var DOT_R = 1.4, DOT_A = 0.11;
/* Точка в самой яркой части пятна. Задаётся абсолютными значениями, а не
   прибавкой: так в одном месте видно, между чем и чем ходит точка. */
var DOT_R_MAX = 1.8, DOT_A_MAX = 0.215;
/* Масштаб самих пятен. 1 — те размеры, что заданы в DOT_KINDS. */
var DOT_BLOB = 1;
var DOT_RAMP = [[0, 90,169,247], [0.45, 31,111,235], [1, 122,90,245]];
var DOT_POS = [0.45, 0, 1];              /* c: 0 синий, 1 голубой, 2 фиолетовый */
var DOT_CN = 24, DOT_AN = 24;            /* дробность ленты и прозрачности */
var DOT_SPEED = 1.7;
var dotLUT = null;

function dotRampAt(x){
  for(var i=1;i<DOT_RAMP.length;i++){
    if(x <= DOT_RAMP[i][0] || i === DOT_RAMP.length-1){
      var a = DOT_RAMP[i-1], b = DOT_RAMP[i];
      var t = (x - a[0]) / (b[0] - a[0]);
      if(t < 0) t = 0;
      if(t > 1) t = 1;
      return [Math.round(a[1]+(b[1]-a[1])*t),
              Math.round(a[2]+(b[2]-a[2])*t),
              Math.round(a[3]+(b[3]-a[3])*t)];
    }
  }
}

/* Строки кистей считаются один раз: иначе на каждый кадр уходили бы сотни
   склеек строк и мусор для сборщика. */
function dotBuildLUT(){
  dotLUT = [];
  for(var ci=0; ci<DOT_CN; ci++){
    var col = dotRampAt(ci/(DOT_CN-1));
    dotLUT[ci] = [];
    for(var ai=0; ai<DOT_AN; ai++){
      var f = (ai+0.5)/DOT_AN;
      dotLUT[ci][ai] = "rgba("+col[0]+","+col[1]+","+col[2]+","+(DOT_A + (DOT_A_MAX-DOT_A)*f).toFixed(3)+")";
    }
  }
}

/* Характеры движения. Стоимость на точку у них разная, дороже всех «кляксы»
   (арктангенс на точку), поэтому именно ими и мерили запас по кадрам. */
var DOT_KINDS = [
  function(){ return [
    {kind:"orbit", cx:.22, cy:.24, rx:.30, ry:.22, r:.50, c:0, t:0,   sp:.055},
    {kind:"orbit", cx:.78, cy:.72, rx:.26, ry:.28, r:.46, c:2, t:2.1, sp:.045},
    {kind:"orbit", cx:.50, cy:.48, rx:.34, ry:.18, r:.40, c:1, t:4.0, sp:.035}]; },
  function(){ return [
    {kind:"pulse", cx:.24, cy:.26, r:.46, c:0, t:0,   sp:.13},
    {kind:"pulse", cx:.76, cy:.34, r:.42, c:2, t:2.2, sp:.10},
    {kind:"pulse", cx:.48, cy:.80, r:.44, c:1, t:4.4, sp:.11}]; },
  function(){ return [
    {kind:"blob", cx:.28, cy:.30, rx:.34, ry:.24, r:.52, c:0, t:0,   sp:.05,  wob:.34},
    {kind:"blob", cx:.72, cy:.68, rx:.28, ry:.32, r:.48, c:2, t:3.0, sp:.042, wob:.40}]; },
  function(){ return [
    {kind:"wave", ang:-0.32, w:.30, c:0, t:0,   sp:.09},
    {kind:"wave", ang:-0.32, w:.26, c:2, t:1.3, sp:.09}]; }
];

function dotMod(v, m){ return ((v % m) + m) % m; }  /* в JS остаток бывает отрицательным */

var dotField = null;

function dotFieldMake(canvas){
  var ctx = null;
  try{ ctx = canvas.getContext("2d", {alpha:true}); }catch(e){}
  if(!ctx){ canvas.classList.add("flat"); return null; }   /* запасной путь */

  var w=0, h=0, dots=[], blobs=[], t=0, raf=null, last=0, on=false, seen=true;
  var drift = {x:0, y:0, ang:Math.random()*6.283};

  /* Характер и фазы выбираются заново при каждом запуске игры: два открытия
     подряд не дадут одинаковую картинку. */
  function spawn(){
    blobs = DOT_KINDS[Math.floor(Math.random()*DOT_KINDS.length)]();
    blobs.forEach(function(b){
      b.p1 = Math.random()*6.283; b.p2 = Math.random()*6.283; b.p3 = Math.random()*6.283;
    });
  }

  function resize(){
    var r = canvas.getBoundingClientRect();
    var nw = Math.max(1, Math.round(r.width)), nh = Math.max(1, Math.round(r.height));
    if(nw === w && nh === h) return;
    /* 1:1 к CSS-пикселям, без множителя плотности экрана: точки мелкие и
       мягкие, retina тут ничего не добавит, а площадь вырастет вчетверо. */
    w = canvas.width = nw; h = canvas.height = nh;
    dots = [];
    /* сетка с запасом по краям: дрейф не должен оголять угол */
    for(var y=-DOT_GRID; y<h+DOT_GRID; y+=DOT_GRID)
      for(var x=-DOT_GRID; x<w+DOT_GRID; x+=DOT_GRID) dots.push(x, y);
    if(!on) draw(t);            /* погашенный слой тоже должен быть верного размера */
  }

  /* Путь пятна — сумма синусов с несоизмеримыми частотами. Такая кривая не
     замыкается, поэтому маршрут не повторяется и не читается как «по
     диагонали». Считается раз на пятно за кадр, а не на каждую точку. */
  function centre(b, time){
    /* «Дыхание» стоит на месте и пульсирует радиусом — орбиты у него нет,
       и полей rx/ry тоже: без этой проверки координаты выходили NaN, и
       пятно просто не зажигалось. */
    if(b.kind !== "orbit" && b.kind !== "blob") return [b.cx*w, b.cy*h];
    var a = time*b.sp*6 + b.t;
    var x = b.cx + b.rx*(Math.sin(a)*0.58 + Math.sin(a*1.618 + b.p1)*0.42);
    var y = b.cy + b.ry*(Math.cos(a*0.87 + b.p2)*0.56 + Math.sin(a*1.414 + b.p3)*0.44);
    return [x*w, y*h];
  }

  function draw(time){
    /* Масштаб пятен — среднее геометрическое сторон, а не меньшая сторона.
       По меньшей стороне на узком высоком экране телефона пятно съёживалось
       и закрывало 0.59 высоты вместо 0.79, как задумано; свечение переставало
       читаться. Среднее геометрическое держит одну долю экрана при любой
       форме холста. */
    var min = Math.sqrt(w*h);
    var buckets = {}, plain = [];

    for(var i=0;i<dots.length;i+=2){
      var dx = dots[i] + drift.x, dy = dots[i+1] + drift.y;
      var sum = 0, mixNum = 0;
      for(var b=0;b<blobs.length;b++){
        var bl = blobs[b], e = 0;
        if(bl.kind==="wave"){
          /* расстояние до наклонной линии, которая едет поперёк экрана */
          var pos = ((time*bl.sp + bl.t) % 2.4 - 0.7) * w * 1.1;
          var d = Math.abs((dx - pos) * Math.cos(bl.ang) + dy * Math.sin(bl.ang));
          var wd = bl.w * min * 1.6 * DOT_BLOB;
          e = d < wd ? 1 - d/wd : 0;
          e = e*e;
        } else {
          var p = centre(bl, time);
          var rr = bl.r * min * DOT_BLOB;
          if(bl.kind==="pulse") rr *= 0.72 + 0.42*(0.5+0.5*Math.sin(time*bl.sp*2 + bl.t));
          if(bl.kind==="blob"){
            /* форма перетекает: радиус зависит от направления на точку */
            var ang = Math.atan2(dy-p[1], dx-p[0]);
            rr *= 1 + bl.wob*0.5*Math.sin(ang*3 + time*bl.sp*3) * Math.sin(ang*2 - time*bl.sp*2);
          }
          var ddx = dx-p[0], ddy = dy-p[1];
          var q = (ddx*ddx + ddy*ddy) / (rr*rr);
          e = q < 1 ? (1-q)*(1-q) : 0;
          if(bl.kind==="pulse") e *= 0.35 + 0.65*(0.5+0.5*Math.sin(time*bl.sp*2 + bl.t));
        }
        sum += e;
        mixNum += e * DOT_POS[bl.c];
      }
      var en = sum > 1 ? 1 : sum;
      if(en < 0.04){ plain.push(dx, dy); continue; }
      /* Цвет — взвешенная смесь по ленте, а не «цвет ближайшего пятна»:
         иначе на стыке двух пятен оттенок переключался бы лесенкой. */
      var mix = sum > 0 ? mixNum / sum : 0.45;
      var ci = (mix*(DOT_CN-1) + 0.5)|0;
      if(ci < 0) ci = 0;
      if(ci > DOT_CN-1) ci = DOT_CN-1;
      var ai = (en*DOT_AN)|0;
      if(ai > DOT_AN-1) ai = DOT_AN-1;
      var key = ci*DOT_AN + ai;
      (buckets[key] || (buckets[key] = [])).push(dx, dy);
    }

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "rgba(31,111,235," + DOT_A + ")";
    ctx.beginPath();
    for(var k=0;k<plain.length;k+=2){
      ctx.moveTo(plain[k]+DOT_R, plain[k+1]);
      ctx.arc(plain[k], plain[k+1], DOT_R, 0, 6.2832);
    }
    ctx.fill();
    /* Подсвеченные точки рисуются пачками по оттенку. Пачек много, шаг
       мелкий — границы между ними глаз не ловит; пустые не стоят ничего. */
    for(var kk in buckets){
      var arr = buckets[kk];
      var kc = (kk/DOT_AN)|0, ka = kk % DOT_AN;
      var f = (ka+0.5)/DOT_AN;
      ctx.fillStyle = dotLUT[kc][ka];
      var rad = DOT_R + (DOT_R_MAX-DOT_R)*f;
      ctx.beginPath();
      for(var m=0;m<arr.length;m+=2){
        ctx.moveTo(arr[m]+rad, arr[m+1]);
        ctx.arc(arr[m], arr[m+1], rad, 0, 6.2832);
      }
      ctx.fill();
    }
  }

  function tick(now){
    raf = requestAnimationFrame(tick);
    if(!on || !seen){ last = now; return; }
    if(now - last < 32) return;                  /* около 30 кадров в секунду */
    var dt = Math.min(0.1, (now - last)/1000) * DOT_SPEED;
    last = now;
    t += dt;
    /* Направление дрейфа медленно поворачивается. При постоянном направлении
       сетка всегда ползла вправо-вниз, и это читалось как общая диагональ. */
    drift.ang += dt*0.21;
    drift.x = dotMod(drift.x + Math.cos(drift.ang)*dt*4.5, DOT_GRID);
    drift.y = dotMod(drift.y + Math.sin(drift.ang*0.73)*dt*4.5, DOT_GRID);
    draw(t);
  }

  dotBuildLUT();
  spawn();
  resize();

  /* Без движения — один кадр и тишина: ни таймера, ни наблюдателей. */
  if(reduced()){ draw(1.4); return {resize:resize, set:function(){}}; }

  raf = requestAnimationFrame(tick);
  /* Вкладку свернули — холст перестаёт считать. Иначе фон продолжает
     жечь батарею, пока телефон лежит экраном вниз. */
  document.addEventListener("visibilitychange", function(){
    seen = !document.hidden;
    if(seen) last = 0;
  });

  return {
    resize: resize,
    set: function(v){
      if(v === on) return;
      on = v;
      if(on) last = 0;            /* пауза не должна обернуться скачком времени */
    }
  };
}

function dotsOn(v){
  var el = byId("dots");
  el.hidden = !v;
  if(!dotField) return;
  if(v) dotField.resize();
  dotField.set(v);
}

function dotsInit(){
  var el = byId("dots");
  dotField = dotFieldMake(el);
  if(!dotField) return;
  try{
    new ResizeObserver(function(){ dotField.resize(); }).observe(byId("app"));
  }catch(e){
    window.addEventListener("resize", function(){ dotField.resize(); });
  }
}

function boot(hot){
  paintDeskWall();
  anInit();
  dotsInit();
  var restored=(hot&&hot.S)||loadCur();
  if(restored && restored.phase && ["home","setup","results","rules","stats"].indexOf(restored.phase)<0){
    S=restored;
    if(!S.openAcc) S.openAcc={};
    if(!S.devState) S.devState=S.phase;
    if(!S.rtab) S.rtab="score";
    if(S.phase==="turn"){
      S.carryMs=S.turn?S.turn.remainingMs:null;
      S.turnNo=Math.max(0,S.turnNo-1);
      S.turn=null; S.phase="handoff";
    }
    go(); return;
  }
  S=freshState([], {wordsPerPlayer:5, turnSeconds:60});
  go();
}

try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {S:S}; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});
  } else { boot({}); }
}catch(e){ boot({}); }

})();
</script>

<title>Шляпа MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --bench:#D7DEE8; --bench-ink:#3B4553;
    --paper:#EDF1F7; --surface:#FAFCFF; --raise:#FFFFFF;
    --ink:#141820; --muted:#5A6472; --faint:#8A94A4;
    --line:#CAD2DE; --line-strong:#A1ABBB;
    --accent:#1F6FEB; --accent-2:#5AA9F7; --accent-soft:rgba(31,111,235,.12);
    --ok:#2E9E74; --danger:#D9483B; --gold:#D9A21B; --violet:#7A5AF5;
    --shadow:0 1px 2px rgba(20,24,32,.06), 0 10px 26px rgba(20,24,32,.10);
    --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
    --kbh:214px; --sbh:42px;

    --ion-font-family:"Archivo",system-ui,-apple-system,sans-serif;
    --ion-background-color:#FAFCFF; --ion-background-color-rgb:250,252,255;
    --ion-text-color:#141820; --ion-text-color-rgb:20,24,32;
    --ion-border-color:#CAD2DE;
    --ion-item-background:transparent;
    --ion-color-primary:#1F6FEB; --ion-color-primary-rgb:31,111,235;
    --ion-color-primary-contrast:#ffffff; --ion-color-primary-contrast-rgb:255,255,255;
    --ion-color-primary-shade:#1b61ce; --ion-color-primary-tint:#357ded;
    --ion-color-medium:#7C8698; --ion-color-medium-rgb:124,134,152;
    --ion-color-medium-contrast:#ffffff; --ion-color-medium-contrast-rgb:255,255,255;
    --ion-color-medium-shade:#6d7686; --ion-color-medium-tint:#8992a2;
  }

  html,body{height:100%}
  body{margin:0;background:var(--bench);color:var(--ink);font-family:var(--ui);
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit}
  svg{display:block}
  *::-webkit-scrollbar{width:0;height:0}
  *{scrollbar-width:none}

  /* прибит к вьюпорту: так корпус не может уехать за край */
  .bench{position:fixed;inset:0;display:flex;align-items:stretch;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .rail{flex:none;width:194px;display:flex;flex-direction:column;
    border-right:1px solid rgba(59,69,83,.2);background:rgba(255,255,255,.55);
    padding:14px 12px;gap:12px;overflow-y:auto}
  .railtop{display:flex;flex-direction:column;gap:1px}
  .raileyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .railname{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--bench-ink)}
  .railstates{display:flex;flex-direction:column;gap:4px}
  .chip{border:1px solid rgba(59,69,83,.2);background:#fff;color:var(--bench-ink);
    border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:7px}
  .chip:hover{border-color:var(--bench-ink)}
  .chip[aria-pressed=true]{background:var(--bench-ink);color:#fff;border-color:var(--bench-ink)}
  .chip .n{font-family:var(--mono);font-size:9.5px;opacity:.55;width:14px;flex:none}
  .railreset{border:1px solid rgba(31,111,235,.45);background:#fff;color:var(--accent);
    border-radius:8px;padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
  .railnote{font-size:11px;line-height:1.35;color:var(--bench-ink);opacity:.72}

  /* дорожки задаём явно: у авторазмерной строки height:100% корпуса ссылается
     сам на себя, ссылка закольцовывается, и корпус вытягивается под контент */
  .stage{flex:1;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;padding:14px;
    grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
  .phone{position:relative;width:min(390px,100%);height:100%;max-height:844px;min-height:0;
    background:#000;border-radius:44px;padding:9px;
    box-shadow:0 2px 3px rgba(0,0,0,.18), 0 22px 50px rgba(20,24,32,.32);display:flex}
  .island{position:absolute;top:19px;left:50%;transform:translateX(-50%);
    width:98px;height:26px;background:#000;border-radius:999px;z-index:12;pointer-events:none}
  .screenarea{position:relative;flex:1;min-width:0;min-height:0;border-radius:36px;overflow:hidden;
    background:var(--surface);display:flex;flex-direction:column}
  .statusbar{flex:none;height:var(--sbh);display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 20px 5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
    position:relative;z-index:30;background:var(--surface)}
  .statusbar .sbr{display:flex;align-items:center;gap:5px;color:var(--ink)}
  .statusbar .sbr svg{height:12px;width:auto}
  .homebar{flex:none;height:22px;display:grid;place-items:center}
  .homebar i{display:block;width:124px;height:5px;border-radius:999px;background:rgba(20,24,32,.24)}
  #app{position:relative;flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
  /* слой точек исключён: иначе id-селектор сбивал ему position на relative */
  #app > *:not(.dotlayer){position:relative;z-index:1}
  /* мягкие пятна под партией */
  #app.playing{
    background-image:
      radial-gradient(circle at 16% 14%, rgba(90,169,247,.15), rgba(90,169,247,0) 46%),
      radial-gradient(circle at 86% 84%, rgba(31,111,235,.12), rgba(31,111,235,0) 44%)}
  #app.playing .ctx{background:transparent}

  /* Точки живут отдельным слоем и медленно дрейфуют. Двигаем слой трансформом,
     а не background-position: перерисовка фона на каждом кадре телефону дорога,
     и дрейф на нём вставал. Слой с запасом по краям, чтобы сдвиг не оголял угол. */
  #app > .dotlayer{position:absolute;inset:-48px;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle at 1.4px 1.4px, rgba(31,111,235,.11) 1.4px, transparent 0);
    background-size:20px 20px;animation:drift 9s linear infinite;will-change:transform}
  /* шаг кратен клетке, поэтому цикл замыкается без рывка */
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(20px,40px,0)}}

  /* мягкая смена экранов */
  .screen.enter{animation:scrIn .24s cubic-bezier(.2,.7,.3,1)}
  @keyframes scrIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .overlay{animation:ovIn .22s cubic-bezier(.2,.7,.3,1)}
  @keyframes ovIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  @media (max-width:860px){
    .bench{flex-direction:column}
    .rail{width:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
      border-right:0;border-bottom:1px solid rgba(59,69,83,.2);padding:8px 10px;gap:8px}
    .railtop,.railnote{display:none}
    .railstates{flex-direction:row;gap:5px}
    .chip{white-space:nowrap;border-radius:999px;padding:6px 11px}
    .chip .n{display:none}
    .railreset{white-space:nowrap;border-radius:999px}
    .stage{padding:8px}
  }
  @media (max-width:520px){
    .stage{padding:0}
    .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
    .screenarea{border-radius:0}
    .island{display:none}
    :root{--sbh:26px}
  }

  .scrollthumb{position:absolute;right:3px;width:3px;border-radius:999px;
    background:rgba(20,24,32,.3);opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:9}

  .hdr{flex:none;display:flex;align-items:center;min-height:44px;padding:4px 6px;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .hdr .hside{flex:none;min-width:72px;display:flex;align-items:center;gap:2px}
  .hdr .hside.right{justify-content:flex-end}
  .hdr .htitle{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtn{flex:none;height:34px;min-width:34px;padding:0 6px;display:flex;align-items:center;
    border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--accent)}
  .hbtn:hover{background:var(--accent-soft)}
  .hbtn svg{width:21px;height:21px}

  .progbar{flex:none;height:3px;background:var(--line);overflow:hidden}
  .progbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
  .progbar.timer i{transition:none}
  .progbar.low i{background:var(--danger)}
  .progbar.prep i{background:var(--accent)}
  .progbar.done i{background:var(--ok)}

  .ctx{flex:none;padding:8px 16px 2px;text-align:center}
  .ctx .l1,.ctx .l2{font-size:12.5px;color:var(--faint)}

  .screen{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
  .pad{padding:16px 14px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
  .kbopen .pad{padding-bottom:calc(var(--kbh) + 14px)}

  h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  p{margin:0;color:var(--muted);font-size:13.5px}
  .eyebrow{font-size:12px;font-weight:600;color:var(--faint)}
  .stub{border:1px dashed var(--line-strong);border-radius:10px;padding:14px 12px;
    font-size:13.5px;color:var(--muted);text-align:center}
  .note{border-left:2px solid var(--line-strong);padding:2px 0 2px 10px;font-size:12.5px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);min-height:16px}
  .hint.bad{color:var(--danger)}
  .spacer{flex:1;min-height:6px}
  .fieldlabel{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}

  /* пара «объясняет → угадывает» */
  .pairbox{display:flex;align-items:center;gap:7px;min-width:0}
  .pairbox .pn1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pairbox .pra{flex:none;display:grid;place-items:center;color:var(--faint)}
  .pairbox .pra svg{width:15px;height:15px}

  .tfrow{display:flex;gap:8px;align-items:stretch;height:42px}
  /* 16px обязательны: на меньшем кегле Safari на айфоне зумит страницу при фокусе */
  .tf{flex:1;min-width:0;height:42px;font-family:var(--ui);font-size:16px;padding:0 13px;color:var(--ink);
    background:rgba(20,24,32,.05);border:1px solid transparent;border-radius:11px}
  .tf:focus{outline:none;border-color:var(--accent);background:var(--raise)}
  .tf:disabled{opacity:.5}
  /* многострочное поле отзыва: класс tf оставлен, чтобы в корпусе прототипа
     его подхватывала фейковая клавиатура, а .ta перебивает фиксированную высоту */
  .ta{height:auto;min-height:104px;padding:10px 13px;line-height:1.45;resize:none;display:block}
  /* .tf растягивается через flex внутри .tfrow; в одиночку ширину задаём сами */
  /* .tf несёт flex:1 ради строки .tfrow. В колоночном контейнере то же
     правило начинает управлять высотой и схлопывает поле, поэтому гасим */
  .tfwide{width:100%;display:block;flex:none}
  .fbhint{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--faint)}
  /* оценка: пять лиц, невыбранные приглушены, чтобы выбранное читалось сразу */
  /* уголок над геро: кнопка не должна спорить с логотипом за внимание */
  .topright{display:flex;justify-content:flex-end;margin-bottom:-6px}
  .ghostbtn{width:40px;height:40px;display:grid;place-items:center;border:0;
    background:none;color:var(--muted);cursor:pointer;border-radius:12px;padding:0}
  .ghostbtn svg{width:21px;height:21px}
  .ghostbtn:active{background:rgba(20,24,32,.06)}
  .toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
    background:var(--bench-ink);color:#fff;border-radius:999px;padding:9px 16px;
    font-size:13.5px;font-weight:600;white-space:nowrap;pointer-events:none;
    box-shadow:0 8px 22px rgba(20,24,32,.28);animation:toastIn .22s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  /* ================= инструкция =================
     Карточки те же, что в журнале ходов: .acc, .acchead, .accbody описаны
     ниже по файлу. Здесь только то, чего там нет. */
  .acchead .atitle{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .accbody p{font-size:13.5px;margin-bottom:10px}
  .accbody p:last-child{margin-bottom:0}
  /* в вопросах номеров нет, поэтому и отступ под них не нужен */
  .faq .accbody{padding-left:12px}

  /* Живой фрейм: показывает этап вместо того, чтобы описывать его словами */
  .demo{position:relative;height:136px;border-radius:14px;overflow:hidden;
    background:var(--raise);border:1px solid var(--line)}
  .demo .cap{position:absolute;left:11px;top:9px;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint);font-weight:600}

  /* телефон переходит по кругу */
  .dpass{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:26px;
    padding-bottom:34px}
  .dperson{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
  /* телефон идёт под кружками, иначе закрывает букву того, у кого он сейчас */
  .dphone{position:absolute;top:50%;left:50%;width:19px;height:30px;border-radius:5px;
    background:var(--bench-ink);margin-top:20px;margin-left:-9.5px;
    animation:dpass 4.2s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes dpass{
    0%,14%{transform:translateX(-60px)} 30%,44%{transform:translateX(0)}
    60%,74%{transform:translateX(60px)} 90%,100%{transform:translateX(-60px)}}

  /* слова падают в шляпу */
  .dhat{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    width:52px;height:52px;color:var(--accent)}
  .dword{position:absolute;left:50%;top:26px;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
    padding:4px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;
    animation:dfall 3.6s ease-in infinite;opacity:0}
  .dword.w2{animation-delay:1.2s} .dword.w3{animation-delay:2.4s}
  @keyframes dfall{
    0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}
    18%{opacity:1;transform:translate(-50%,0) scale(1)}
    55%{opacity:1;transform:translate(-50%,0) scale(1)}
    85%,100%{opacity:0;transform:translate(-50%,44px) scale(.72)}}

  /* карточка уходит вверх, следом встаёт новая */
  .dcard{position:absolute;left:50%;top:50%;width:132px;height:64px;margin:-32px 0 0 -66px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    display:grid;place-items:center;font-size:14px;font-weight:700;
    box-shadow:0 2px 8px rgba(20,24,32,.08);animation:dswipe 3.4s ease-in-out infinite}
  .dcard.back{animation:dback 3.4s ease-in-out infinite;z-index:0;color:var(--muted)}
  @keyframes dswipe{
    0%,26%{transform:translateY(0);opacity:1}
    46%,100%{transform:translateY(-96px);opacity:0}}
  @keyframes dback{
    0%,30%{transform:translateY(9px) scale(.96);opacity:.5}
    52%,100%{transform:translateY(0) scale(1);opacity:1}}
  .dplus{position:absolute;left:50%;top:32px;margin-left:-12px;color:var(--ok);
    font-size:17px;font-weight:800;opacity:0;animation:dplus 3.4s ease-out infinite}
  @keyframes dplus{0%,30%{opacity:0;transform:translateY(6px)}
    44%{opacity:1;transform:translateY(-6px)} 70%,100%{opacity:0;transform:translateY(-20px)}}
  .dswipehint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}

  /* форматы сменяют друг друга */
  .dmodes{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:7px}
  .dmode{border:1px solid var(--line);border-radius:999px;padding:5px 14px;
    font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);
    animation:dmode 5.4s ease-in-out infinite}
  .dmode.m2{animation-delay:1.8s} .dmode.m3{animation-delay:3.6s}
  @keyframes dmode{
    0%,30%{background:var(--accent);border-color:var(--accent);color:#fff}
    34%,100%{background:var(--surface);border-color:var(--line);color:var(--muted)}}

  /* очко достаётся обоим сразу */
  .dboth{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px}
  .dpair{display:flex;flex-direction:column;align-items:center;gap:7px}
  .dpair .dperson{width:38px;height:38px}
  .dpair .role{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .dscore{font-size:13px;font-weight:800;color:var(--ok);opacity:0;animation:dboth 3s ease-out infinite}
  @keyframes dboth{0%,28%{opacity:0;transform:translateY(5px)}
    46%,74%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-6px)}}

  .rate{display:flex;gap:6px}
  .rateb{flex:1;min-width:0;height:52px;border:1px solid var(--line);border-radius:12px;
    background:var(--raise);font-size:25px;line-height:1;cursor:pointer;padding:0;
    filter:grayscale(1);opacity:.45;transition:opacity .15s ease,filter .15s ease,border-color .15s ease}
  .rateb[aria-pressed=true]{filter:none;opacity:1;border-color:var(--accent);
    box-shadow:inset 0 0 0 1px var(--accent)}
  /* категории переносятся на вторую строку: подписи длиннее, чем влезает в сегменты */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chipb{border:1px solid var(--line);background:var(--raise);color:var(--muted);
    border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:500;cursor:pointer}
  .chipb[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  /* выравниваем по первой строке подписи: при переносе галочка не должна
     уезжать в середину блока */
  .check{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    border:0;background:none;padding:0;cursor:pointer;font-size:14px;line-height:22px;
    color:var(--ink);min-height:22px}
  .check .box{flex:none;width:22px;height:22px;border:1px solid var(--line-strong);
    border-radius:7px;display:grid;place-items:center;color:transparent}
  .check .box svg{width:14px;height:14px}
  .check[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent);color:#fff}
  .fbstatus{font-size:13px;min-height:18px}
  .fbstatus.bad{color:var(--danger)}
  .fbstatus.ok{color:var(--ok)}
  /* внешняя ссылка остаётся ссылкой: её можно скопировать и открыть в телеграме */
  .linkbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
    border:1px solid var(--accent);border-radius:11px;color:var(--accent);background:transparent;
    font-size:15px;font-weight:600;text-decoration:none;padding:0 14px}
  .linkbtn svg{width:17px;height:17px}
  .fblink{background:none;border:0;padding:6px 0;color:var(--accent);font-size:14px;
    font-weight:600;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:7px}
  .fblink .hornic{width:17px;height:17px;display:block;flex:none}
  .linkbtn .tgi{width:19px;height:19px;display:block;flex:none}
  .addbtn{flex:none;height:42px;padding:0 16px;border:1px solid var(--accent);background:transparent;
    color:var(--accent);border-radius:11px;font-size:14px;font-weight:600;cursor:pointer}
  .addbtn:hover:not(:disabled){background:var(--accent-soft)}
  .addbtn:disabled{opacity:.4;cursor:not-allowed}

  .seg{display:flex;background:rgba(20,24,32,.07);border-radius:10px;padding:2px;gap:2px}
  .seg button{flex:1;min-width:0;height:32px;border:0;background:transparent;border-radius:8px;
    font-family:var(--ui);font-size:13.5px;color:var(--ink);cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

var conf = {parts:[], raf:null};
function reduced(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; }
}
function confettiBurst(){
  if(reduced()) return;
  var c = byId("conf");
  if(!c) return;
  var r = c.getBoundingClientRect();
  if(c.width !== Math.round(r.width)) c.width = Math.round(r.width);
  if(c.height !== Math.round(r.height)) c.height = Math.round(r.height);
  var cols = ["#1F6FEB","#5AA9F7","#2E9E74","#D9A21B","#7A5AF5"];
  for(var i=0;i<22;i++){
    var a = -Math.PI/2 + (Math.random()-.5)*1.7;
    var sp = 3.6 + Math.random()*4.6;
    conf.parts.push({x:c.width/2, y:c.height*0.46, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      g:0.16+Math.random()*0.09, s:4+Math.random()*4.5, rot:Math.random()*6.3,
      vr:(Math.random()-.5)*0.42, col:cols[i%cols.length], life:1});
  }
  if(!conf.raf) confTick();
}
function confTick(){
  var c = byId("conf");
  if(!c){ conf.raf=null; conf.parts=[]; return; }
  var ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  conf.parts.forEach(function(p){
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.016;
    if(p.life <= 0) return;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life*1.7));
    ctx.fillStyle = p.col;
    ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.62);
    ctx.restore();
  });
  conf.parts = conf.parts.filter(function(p){ return p.life > 0; });
  if(conf.parts.length){ conf.raf = requestAnimationFrame(confTick); }
  else { conf.raf = null; ctx.clearRect(0,0,c.width,c.height); }
}

function ping(step){
  try{
    if(!audio) return;
    var semis = [0,2,4,5,7,9,11,12], i = Math.min(Math.max(step-1,0), semis.length-1);
    var f = 523.25 * Math.pow(2, semis[i]/12);
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, audio.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+0.3);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime+0.32);
  }catch(e){}
}

      var left = kbNums ? '<button class="key wide" data-act="nums">АБВ</button>'
                        : '<button class="key wide'+(kbShift?" on":"")+'" data-act="shift">⇧</button>';
      keys = left + keys + '<button class="key wide" data-act="back">⌫</button>';
    }
    html += '<div class="kbrow">'+keys+'</div>';
  });
  html += '<div class="kbrow"><button class="key wide" data-act="nums">'+(kbNums?"АБВ":"123")+'</button>'+
    '<button class="key space" data-ch=" ">пробел</button>'+
    '<button class="key go" data-act="go">Готово</button></div>';
  kb.innerHTML = html;
  kb.querySelectorAll("button").forEach(function(b){
    b.addEventListener("pointerdown", function(e){ e.preventDefault(); });
    b.onclick = function(){
      if(b.dataset.ch !== undefined){
        kbInsert(b.dataset.ch);
        if(kbShift && !kbNums){ kbShift=false; kbRender(); }
        return;
      }
      var a = b.dataset.act;
      if(a==="shift"){ kbShift=!kbShift; kbRender(); }
      else if(a==="nums"){ kbNums=!kbNums; kbShift=false; kbRender(); }
      else if(a==="back"){ kbBack(); }
      else if(a==="go"){ kbGo(); }
    };
  });
}
function kbInsert(ch){
  var el=kbTarget; if(!el) return;
  var s=el.selectionStart, e=el.selectionEnd;
  if(s===null||s===undefined){ s=e=el.value.length; }
  el.value = el.value.slice(0,s)+ch+el.value.slice(e);
  try{ el.selectionStart=el.selectionEnd=s+ch.length; }catch(err){}
  el.dispatchEvent(new Event("input",{bubbles:true}));
}
function kbBack(){
  var el=kbTarget; if(!el) return;
  var s=el.selectionStart, e=el.selectionEnd;
  if(s===null||s===undefined){ s=e=el.value.length; }
  if(s===e){ if(s===0) return; s=s-1; }
  el.value = el.value.slice(0,s)+el.value.slice(e);
  try{ el.selectionStart=el.selectionEnd=s; }catch(err){}
  el.dispatchEvent(new Event("input",{bubbles:true}));
}
function kbGo(){
  var el=kbTarget; if(!el) return;
  el.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true}));
}
function kbShow(el){
  if(kbOff()) return;
  kbTarget=el; kbShift=false; kbNums=false;
  kbRender();
  byId("kb").classList.add("up");
  byId("screenarea").classList.add("kbopen");
  setTimeout(function(){ try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }, 60);
}
function kbHide(){
  kbTarget=null;
  var kb=byId("kb"); if(kb) kb.classList.remove("up");
  var sa=byId("screenarea"); if(sa) sa.classList.remove("kbopen");
}
document.addEventListener("focusin", function(e){
  if(e.target && e.target.classList && e.target.classList.contains("tf")) kbShow(e.target);
});
document.addEventListener("focusout", function(e){
  if(e.target && e.target.classList && e.target.classList.contains("tf")){
    setTimeout(function(){
      var a=document.activeElement;
      if(!a || !a.classList || !a.classList.contains("tf")) kbHide();
    },120);
  }
});

var DEV_STATES = [
  ["home","Главный экран"], ["rules","Правила"], ["stats","Статистика"],
  ["setup-empty","Настройка пустая"], ["setup","Настройка"],
  ["entry","Ввод слов"], ["entry-done","Ввод завершён"], ["roster","Список игроков"],
  ["handoff","Передача"], ["turn","Ход"], ["boundary","Граница раунда"],
  ["review","Итог хода"], ["round3","Финальный раунд"],
  ["sheet","Пауза"], ["results","Финал"]
];
function renderDev(){
  var host=byId("dev-chips"), sel=(S && S.devState)||"home";
  if(!host) return;            // в чистой сборке рельсы нет
  host.innerHTML = DEV_STATES.map(function(d,i){
    return '<button class="chip" data-go="'+d[0]+'" aria-pressed="'+(d[0]===sel)+'">'+
      '<span class="n">'+(i+1)+'</span>'+d[1]+'</button>';
  }).join("");
  host.querySelectorAll("[data-go]").forEach(function(b){ b.onclick=function(){ devJump(b.dataset.go); }; });
}
function seedPlayers(k){ return SEED_NAMES.slice(0,k).map(function(n){ return {id:uid(), name:n}; }); }
function seedWords(){
  var pool=shuffle(SEED_WORDS), k=0;
  S.words=[];
  S.players.forEach(function(p){
    for(var i=0;i<S.settings.wordsPerPlayer;i++){
      S.words.push({id:uid(), text:pool[k%pool.length], authorId:p.id, returns:0}); k++;
    }
  });
}
function ensureGame(){
  if(S.players.length < MIN_PLAYERS) S.players = seedPlayers(5);
  if(S.words.length < S.players.length) seedWords();
  if(!S.order.length){
    S.order = S.players.map(function(p){ return p.id; });
    S.hat = shuffle(allIds());
  }
}
function simTurn(){
  var pr=currentPair(), startRound=S.round, items=[];
  var want = 2 + Math.floor(Math.random()*4);
  for(var i=0;i<want;i++){
    if(!S.hat.length){ if(S.round<3) S.round++; S.hat = shuffle(allIds()); }
    var id = S.hat.shift();
    items.push({wordId:id, guessed:true, round:S.round, ms:900+Math.floor(Math.random()*5200)});
  }
  if(S.hat.length){
    var m=S.hat.shift(), w=word(m);
    if(w) w.returns++;
    items.push({wordId:m, guessed:false, round:S.round, ms:null});
    S.hat.push(m); S.hat = shuffle(S.hat);
  }
  S.turnNo++;
  S.log.push({no:S.turnNo, ex:pr.ex, gu:pr.gu, startRound:startRound, endRound:S.round, items:items});
  return advanceState();
}
function devJump(target){
  stopTimer(); kbHide(); wakeOff();
  byId("o-sheet").hidden=true; byId("o-flash").hidden=true; byId("o-roster").hidden=true;
  var keep = S ? S.settings : null;

  if(target==="home"){ S=freshState([],keep); S.devState="home"; go(); return; }
  if(target==="rules"||target==="stats"){ S=freshState([],keep); S.devState=target; S.phase=target; go(); return; }
  if(target==="setup-empty"){ S=freshState([],keep); S.devState=target; S.phase="setup"; go(); return; }
  if(target==="setup"){ S=freshState(SEED_NAMES.slice(0,5),keep); S.devState=target; S.phase="setup"; go(); return; }

  if(target==="entry"||target==="entry-done"||target==="roster"){
    S=freshState(SEED_NAMES.slice(0,5),keep);
    S.devState=target; S.phase="entry"; S.entryIndex=0;
    if(target==="entry"){
      var p2=S.players[1];
      for(var i=0;i<2;i++) S.words.push({id:uid(), text:SEED_WORDS[i], authorId:p2.id, returns:0});
    } else if(target==="entry-done"){ seedWords(); }
    else {
      S.players.forEach(function(p,i){
        var k = i===0?5:(i===1?3:(i===2?1:0));
        for(var j=0;j<k;j++) S.words.push({id:uid(), text:SEED_WORDS[(i*5+j)%SEED_WORDS.length]+"·"+i+j, authorId:p.id, returns:0});
      });
    }
    go();
    if(target==="roster") openRoster();
    return;
  }

  S=freshState(SEED_NAMES.slice(0,5),keep);
  S.devState=target;
  ensureGame();
  if(target==="handoff"){ S.phase="handoff"; go(); return; }
  if(target==="turn"){ S.phase="handoff"; go(); startTurn(); return; }
  if(target==="boundary"){ S.round=1; S.hat=[allIds()[0]]; S.phase="handoff"; go(); startTurn(); return; }
  if(target==="review"){ simTurn(); S.phase="review"; go(); return; }
  if(target==="round3"){ var g=0; while(S.round<3&&g++<400){ if(simTurn()) break; } S.phase="handoff"; go(); return; }
  if(target==="sheet"){ simTurn(); simTurn(); S.phase="handoff"; go(); openSheet("score"); return; }
  if(target==="results"){ var k2=0; while(k2++<600){ if(simTurn()) break; } finish(); return; }
}

function prepProgress(){
  var n=S.players.length;
  var roster = Math.min(1, n/MIN_PLAYERS)*0.25;
  var target = Math.max(1, n*S.settings.wordsPerPlayer);
  var words = (n>=MIN_PLAYERS) ? (S.words.length/target)*0.75 : 0;
  return roster+words;
}
function renderProgress(){
  var bar=byId("progbar"), fill=byId("prog");
  if(!bar||!fill) return;
  // на итоге, главном, правилах и истории прогрессу нечего показывать
  if(["results","home","rules","stats"].indexOf(S.phase)>=0){ bar.hidden=true; return; }
  bar.hidden=false;
  var v=0, cls="";
  if(S.phase==="turn" && S.turn){
    var total = Math.max(1, S.turn.startMs || S.settings.turnSeconds*1000);
    v = Math.max(0, Math.min(1, S.turn.remainingMs/total));
    cls = "timer"+(secsLeft()<=10?" low":"");
  } else if(S.phase==="setup"||S.phase==="entry"){
    v = prepProgress(); cls = (v>=0.999)?"done":"prep";
  } else {
    var t2=Math.max(1,S.words.length);
    if(S.round===1) v=(t2-S.hat.length)/t2/3;
    else if(S.round===2) v=(1+(t2-S.hat.length)/t2)/3;
    else v=(2+Math.min(1,S.round3Turns/Math.max(1,S.players.length)))/3;
  }
  bar.className = "progbar "+cls;
  fill.style.width = (Math.max(0,Math.min(1,v))*100).toFixed(2)+"%";
}

var hatTimer=null, hatIdx=0;
function mountHats(){
  var host=byId("hatstack");

  host.innerHTML = HATS.map(function(h,i){
    return '<span class="hi'+(i===0?" on":"")+'">'+h+'</span>';
  }).join("");

  clearInterval(hatTimer);
  hatTimer = setInterval(nextHat, 2700);
  host.onclick = bumpHat;

function nextHat(){
  var host=byId("hatstack");
  if(!host || host.offsetParent === null){ clearInterval(hatTimer); hatTimer=null; return; }
  var items=host.querySelectorAll(".hi");
  if(!items.length) return;
  items[hatIdx].classList.remove("on");
  hatIdx=(hatIdx+1)%items.length;
  items[hatIdx].classList.add("on");
}
function bumpHat(){
  var host=byId("hatstack");
  if(!host) return;
  host.classList.remove("bump"); void host.offsetWidth; host.classList.add("bump");
  buzz(9);
  nextHat();
  clearInterval(hatTimer);
  hatTimer = setInterval(nextHat, 2700);
}

function addPlayer(){
  var i=byId("newname"), v=i.value.trim().replace(/\s+/g," "), msg=byId("pmsg");
  if(!v){ msg.className="hint bad"; msg.textContent="Введите имя"; return; }
  if(v.length<2){ msg.className="hint bad"; msg.textContent="Слишком короткое имя"; return; }
  if(S.players.some(function(p){ return p.name.toLowerCase()===v.toLowerCase(); })){
    msg.className="hint bad"; msg.textContent="Такой игрок уже есть"; return;
  }
  if(S.players.length>=10){ msg.className="hint bad"; msg.textContent="Уже 10 игроков"; return; }
  S.players.push({id:uid(), name:v});
  go();
  var f=byId("newname");
  if(f){ f.focus(); kbShow(f); }
}

function entryDone(pid){ return wordsOf(pid).length >= S.settings.wordsPerPlayer; }
function allEntered(){ return S.players.length>=MIN_PLAYERS && S.players.every(function(p){ return entryDone(p.id); }); }
function nextUnfinished(from){
  var n=S.players.length;
  for(var k=1;k<=n;k++){ var i=(from+k)%n; if(!entryDone(S.players[i].id)) return i; }
  return -1;
}
function renderEntry(){
  var el=byId("s-entry"), p=S.players[S.entryIndex];
  if(!p){ S.phase="setup"; go(); return; }
  var need=S.settings.wordsPerPlayer, mine=wordsOf(p.id), done=mine.length>=need, nxt=nextUnfinished(S.entryIndex);

  el.innerHTML =
    '<div class="pad">'+
      '<h1>'+esc(p.name)+' придумывает '+num(need,"слово","слова","слов")+'</h1>'+
      '<div><div class="tfrow">'+
        '<input class="tf" type="text" id="wordin" placeholder="Слово" maxlength="24" autocomplete="off" autocorrect="off" spellcheck="false"'+(done?" disabled":"")+'>'+
        '<button class="addbtn" id="addw"'+(done?" disabled":"")+'>Добавить</button></div>'+
        '<div class="hint" id="wmsg"></div></div>'+
      (mine.length ? '<div>'+mine.map(function(w,i){
          return '<div class="prow"><span class="idx">'+(i+1)+'</span>'+
            '<span class="nm">'+esc(w.text)+'</span>'+
            '<button class="iconbtn" data-delw="'+w.id+'" aria-label="Убрать слово">'+IC.close+'</button></div>';
        }).join("")+'</div>' : '')+
      '<div class="spacer"></div>'+
      '<div class="actions">'+
        (allEntered()
          ? '<ion-button id="begin" expand="block">Начать партию</ion-button>'
          : '<ion-button id="passnext" expand="block"'+((!done||nxt<0)?" disabled":"")+'>'+
              (nxt>=0 ? "Подтвердить и передать: "+esc(S.players[nxt].name) : "Все уже ввели")+'</ion-button>')+
      '</div>'+
    '</div>';

  var inp=byId("wordin"), msg=byId("wmsg"), b;
  if(!done){
    byId("addw").onclick=tryAdd;
    inp.onkeydown=function(e){ if(e.key==="Enter") tryAdd(); };
    inp.oninput=function(){ msg.className="hint"; msg.textContent=posHint(inp.value)||""; };
  }
  el.querySelectorAll("[data-delw]").forEach(function(x){
    x.onclick=function(){
      S.words=S.words.filter(function(w){ return w.id!==x.dataset.delw; });
      go();
    };
  });
  if((b=byId("begin"))) b.onclick=beginGame;
  if((b=byId("passnext"))) b.onclick=function(){
    var i=nextUnfinished(S.entryIndex);
    if(i>=0){ S.entryIndex=i; kbHide(); go(); }
  };

  function bad(t){ msg.className="hint bad"; msg.textContent=t; }
  function tryAdd(){
    var v=inp.value.trim().replace(/\s+/g," ");
    if(!v){ bad("Пустое поле"); return; }
    if(v.replace(/[^0-9A-Za-zА-Яа-яЁё]/g,"").length<2){ bad("Нужно хотя бы две буквы"); return; }
    if(mine.length>=need){ bad("Уже "+num(need,"слово","слова","слов")); return; }
    if(S.words.some(function(w){ return w.text.toLowerCase()===v.toLowerCase(); })){ bad("Это слово уже в шляпе"); inp.select(); return; }
    var h=posHint(v);
    S.words.push({id:uid(), text:v, authorId:p.id, returns:0});
    buzz(8);
    go();
    var f=byId("wordin"), m=byId("wmsg");
    if(f && !f.disabled){ f.focus(); kbShow(f); }
    if(m && h){ m.className="hint"; m.textContent="Добавлено. "+h; }
  }
}

function fbGet(k){ try{ return localStorage.getItem(FB_STORE+"."+k); }catch(e){ return null; } }
function fbSet(k,v){ try{ localStorage.setItem(FB_STORE+"."+k, v); }catch(e){} }
function fbDel(k){ try{ localStorage.removeItem(FB_STORE+"."+k); }catch(e){} }

function fbFormOn(){ return !!FEEDBACK_URL; }
function fbTgOn(){ return !!TELEGRAM_URL; }
function fbAvailable(){ return fbFormOn() || fbTgOn(); }

/* Что уходит вместе с отзывом. Содержимое партии сюда не попадает:
   имена игроков и загаданные слова - чужие данные, а в шляпе пишут всякое.
   Счётчики и настройки этого не раскрывают, но дают воспроизвести баг. */
function fbContext(){
  var vp = window.visualViewport;
  var w = Math.round(vp ? vp.width : window.innerWidth);
  var h = Math.round(vp ? vp.height : window.innerHeight);
  var c = {
    build: BUILD,
    at: new Date().toISOString(),
    screen: fbWhere(),
    viewport: w + "x" + h,
    dpr: window.devicePixelRatio || 1,
    lang: navigator.language || "",
    reducedMotion: reduced(),
    ua: navigator.userAgent || ""
  };
  try{ c.standalone = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }catch(e){}
  if(S){
    c.round = S.round;
    c.players = S.players.length;
    c.words = S.words.length;
    c.hatLeft = S.hat.length;
    c.turnNo = S.turnNo;
    c.settings = {wordsPerPlayer:S.settings.wordsPerPlayer, turnSeconds:S.settings.turnSeconds};
  }
  return c;
}
/* Экран, с которого написали: если поверх лежала шторка или ростер, важна она,
   а не фаза под ней. */
function fbWhere(){
  var o = byId("o-sheet"), r = byId("o-roster"), f = byId("o-flash");
  if(o && !o.hidden) return "пауза";
  if(r && !r.hidden) return "список игроков";
  if(f && !f.hidden) return "граница раунда";
  return (S && S.phase) || "?";
}

/* Короткое сообщение поверх экрана: используется там, где действие
   завершилось, но показывать целый экран не за чем. */
var toastTimer = null;
function toast(text){
  var area = byId("screenarea");
  if(!area) return;
  var old = byId("toast");
  if(old) old.remove();
  var el = document.createElement("div");
  el.className = "toast"; el.id = "toast"; el.textContent = text;
  area.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if(el.parentNode) el.remove(); }, 2200);
}

/* Системное окно отправки, а если его нет - копируем ссылку в буфер.
   Адрес берём без хвоста: в нём может оказаться ?app или якорь. */
function shareGame(){
  var url = location.origin + location.pathname;
  var data = {title:"Шляпа", text:"Игра в Шляпу: объясняем и угадываем свои слова", url:url};
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
      navigator.share(data).catch(function(){});
      return;
    }
  }catch(e){}
  try{
    navigator.clipboard.writeText(url).then(function(){ toast("Ссылка скопирована"); },
                                           function(){ toast("Не вышло скопировать"); });
  }catch(e){ toast("Не вышло скопировать"); }
}

  inner.innerHTML =

    if(f){
      f.hidden = !fbReach;
      if(fbReach){ try{ f.focus(); }catch(e){} } else { f.value = ""; fbSet("contact", ""); }
    }
    r.setAttribute("aria-pressed", fbReach);
    requestAnimationFrame(syncSticky);
  };
  var b = byId("fb-send");
  if(b) b.onclick = sendFeedback;
  requestAnimationFrame(syncSticky);
}

function sendFeedback(){
  var t = byId("fb-text"), c = byId("fb-contact"), hp = byId("fb-hp"), b = byId("fb-send");
  if(!t) return;
  if(hp && hp.value){ fbSent(); return; }        // бот заполнил ловушку: молча прощаемся
  var text = t.value.trim();
  /* Одной оценки или категории достаточно: человек не обязан ничего писать,
     чтобы сказать, что игра понравилась. */
  if(!text && !fbRate && !fbKind){ fbStatus("Поставьте оценку или напишите пару слов", "bad"); return; }
  if(text && text.length < FB_MIN){ fbStatus("Слишком коротко", "bad"); try{ t.focus(); }catch(e){} return; }

  var last = +(fbGet("last") || 0);
  var wait = Math.ceil((FB_COOLDOWN_MS - (Date.now() - last)) / 1000);
  if(wait > 0){ fbStatus("Отзыв только что ушёл, подождите " + num(wait,"секунду","секунды","секунд"), "bad"); return; }

  kbHide();
  b.disabled = true;
  fbStatus("Отправляем...");

  var ctrl = null, timer = null;
  try{ ctrl = new AbortController(); }catch(e){}
  if(ctrl) timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, FB_TIMEOUT_MS);

  fetch(FEEDBACK_URL, {
    method: "POST", mode: "cors", headers: {"content-type": "application/json"},
    body: JSON.stringify({
      text: text,
      rate: fbRate || null,
      kind: fbKind || "",
      contact: (fbReach && c) ? c.value.trim().slice(0,120) : "",
      ctx: fbContext()
    }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    if(timer) clearTimeout(timer);
    fbSent();
  }).catch(function(){
    if(timer) clearTimeout(timer);
    b.disabled = false;
    /* Текст не стираем и черновик не трогаем: отправить не вышло,
       человек должен иметь возможность скопировать написанное в телеграм. */
    fbStatus(fbTgOn() ? "Не отправилось. Попробуйте ещё раз или напишите в телеграм"
                      : "Не отправилось. Попробуйте ещё раз позже", "bad");
  });
}
function fbSent(){
  fbSet("last", String(Date.now()));
  fbDel("draft");
  fbRate = 0; fbKind = ""; fbReach = false;
  fbSet("contact", "");
  renderFeedback();
  fbStatus("Спасибо, отзыв ушёл", "ok");
  buzz(12);
}

function beginGame(){
  kbHide();
  S.order=S.players.map(function(p){ return p.id; });
  S.lap=1; S.idx=0; S.round=1; S.round3Turns=0;
  S.hat=shuffle(allIds());
  S.log=[]; S.turnNo=0; S.carryMs=null; S.turn=null;
  S.phase="handoff";
  go();
}
function currentPair(){
  var n=S.order.length;
  return { ex:S.order[S.idx%n], gu:S.order[(S.idx+1)%n] };
}
function renderHandoff(){
  var el=byId("s-handoff"), pr=currentPair(), r=ROUNDS[S.round];
  el.innerHTML =
    '<div class="center">'+
      '<div class="who">'+esc(pname(pr.ex))+'</div><div class="role">объясняет</div>'+
      '<div class="between">'+IC.down+'</div>'+
      '<div class="who">'+esc(pname(pr.gu))+'</div><div class="role">угадывает</div>'+
      '<div style="height:18px"></div>'+
      '<div class="note" style="text-align:left">'+esc(r.rule)+'<br>'+num(secsLeft(),"секунда","секунды","секунд")+'</div>'+
      '<div style="height:18px"></div>'+
      '<ion-button id="startturn" style="min-width:210px">Начать ход</ion-button>'+
    '</div>';
  byId("startturn").onclick=startTurn;
}
function startTurn(){
  unlockAudio(); wakeOn();
  var pr=currentPair();
  S.turnNo++;
  S.turn={no:S.turnNo, ex:pr.ex, gu:pr.gu, startRound:S.round,
    remainingMs:(S.carryMs!==null?S.carryMs:S.settings.turnSeconds*1000),
    startMs:S.settings.turnSeconds*1000, items:[], current:null, streak:0};
  S.carryMs=null;
  // Предыдущая пара могла разобрать шляпу до дна: для новой пары свободны все слова
  if(S.round===3 && !S.hat.length) S.hat=round3Refill();
  drawWord();
  S.wordShownAt=Date.now();
  S.phase="turn";
  go();
  runTimer();
}
function drawWord(){ S.turn.current = S.hat.length ? S.hat.shift() : null; }

/* стопка под карточкой тает вместе со шляпой: 3, 2, 1, пусто */
function stackHTML(){
  var n = Math.min(3, S.hat.length), out = "";
  for(var i=n;i>=1;i--) out += '<div class="ghost g'+i+'"></div>';
  return out;
}
function paintStack(){
  var st = byId("stack");
  if(st) st.innerHTML = stackHTML();
}

function renderTurn(){
  var el=byId("s-turn");
  var got=S.turn.items.filter(function(i){ return i.guessed; }).length;
  el.innerHTML =
    '<div class="turnwrap">'+
      '<div class="turnhead">'+pairBox(S.turn.ex, S.turn.gu)+
        '<div class="clock" id="clock">0:00</div></div>'+

        '<canvas id="conf"></canvas>'+
        '<div id="stack">'+stackHTML()+'</div>'+
        '<div class="card" id="card">'+
          '<div class="word" id="wordbox">'+esc(wtext(S.turn.current))+'</div>'+
          '<div class="swipehint">'+IC.up+'<span>свайп вверх</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="turnfoot">'+
        '<div class="fmt">угадано <b id="gotn">'+got+'</b></div>'+
        '<ion-button id="gotbtn">Засчитать</ion-button>'+
      '</div>'+
    '</div>';
  byId("gotbtn").onclick=flyOut;

}
function bindSwipe(card){
  if(!card) return;
  var y0=null,t0=0,active=false;
  card.addEventListener("pointerdown", function(e){
    if(e.target.closest("ion-button,button")) return;
    active=true; y0=e.clientY; t0=Date.now();
    card.classList.add("dragging");
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  card.addEventListener("pointermove", function(e){
    if(!active) return;
    var dy=Math.min(0,e.clientY-y0);
    card.style.transform="translateY("+dy+"px) rotate("+(dy/70)+"deg)";
    card.style.opacity=String(Math.max(.3,1+dy/340));
  });
  function release(e){
    if(!active) return;
    active=false;
    card.classList.remove("dragging");
    var dy=(e&&typeof e.clientY==="number"?e.clientY:y0)-y0;
    card.style.transform=""; card.style.opacity="";
    if(dy<-55 && (Date.now()-t0)<1200) flyOut();
  }
  card.addEventListener("pointerup",release);
  card.addEventListener("pointercancel",release);
  card.addEventListener("pointerleave",release);
}
function flyOut(){
  if(swiping || S.phase!=="turn" || !S.turn || !S.turn.current) return;
  swiping=true;
  buzz(12);
  confettiBurst();
  floatPlusOne();
  var z=byId("cardzone");
  if(z && !reduced()){
    z.classList.remove("hit"); void z.offsetWidth; z.classList.add("hit");
  }
  var c=byId("card");
  if(!c){ swiping=false; markGuessed(); return; }
  c.classList.add("gone");
  setTimeout(function(){
    var cc=byId("card"); if(cc) cc.classList.remove("gone");
    swiping=false;
    markGuessed();
  },170);
}
document.addEventListener("keydown", function(e){
  if(S && S.phase==="turn" && (e.code==="Space"||e.code==="ArrowUp")){ e.preventDefault(); flyOut(); }
});

/* Третий раунд длится фиксированное число ходов, а не до последнего слова,
   поэтому опустевшая шляпа в нём пополняется. Возвращаем в неё только те слова,
   которых пара ещё не касалась в этом раунде: дважды отгадать одно и то же
   слово нельзя, и больше слов, чем есть в игре, пара за ход не наберёт. */
function round3Refill(){
  var played={};
  if(S.turn) S.turn.items.forEach(function(i){ if(i.round===3) played[i.wordId]=true; });
  return shuffle(allIds().filter(function(id){ return !played[id]; }));
}
/* Пара разобрала все слова до конца времени: предъявлять больше нечего,
   ход закрывается досрочно. */
function hatEmptied(){
  stopTimer();
  buzz([60,40,60]);
  endTurn();
}
function markGuessed(){
  if(S.phase!=="turn" || !S.turn || !S.turn.current) return;
  var gap = Date.now() - (S.wordShownAt || Date.now());
  S.turn.streak = (gap < 8000) ? (S.turn.streak+1) : 1;
  S.turn.items.push({wordId:S.turn.current, guessed:true, round:S.round, ms:gap});
  S.turn.current=null;

  ping(S.turn.streak);
  popCounter();
  if(S.turn.streak>=3) showStreak(S.turn.streak);

  if(S.hat.length===0){
    if(S.round<3){ roundBoundary(); return; }
    S.hat=round3Refill();
    if(!S.hat.length){ hatEmptied(); return; }
  }
  drawWord();
  S.wordShownAt=Date.now();
  var wb=byId("wordbox"); if(wb) wb.textContent=wtext(S.turn.current);
  var gn=byId("gotn"); if(gn) gn.textContent=S.turn.items.filter(function(i){ return i.guessed; }).length;
  paintStack();
  renderCtx(); save();
}

/* Граница раунда: игра встаёт на паузу и ждёт явного действия.
   Автопродолжение через таймаут не давало паре понять, что правила сменились. */
function roundBoundary(){
  stopTimer(); wakeOff();
  var frozen = S.turn.remainingMs;
  S.round++;
  S.hat = shuffle(allIds());
  var r = ROUNDS[S.round];
  buzz([60,50,60]);
  beep();

  byId("flash-inner").innerHTML =
    '<div class="eyebrow">Шляпа опустела, таймер остановлен</div>'+
    '<div class="big" style="margin-top:2px">Раунд '+r.n+': '+esc(r.name)+'</div>'+
    '<p style="max-width:275px;margin-top:2px">'+esc(r.rule)+'</p>'+
    '<div class="lastgame" style="margin-top:18px;max-width:290px;width:100%;align-items:center;text-align:center">'+
      '<div class="lt">Ход продолжается</div>'+
      '<div style="font-size:16px;font-weight:700;display:flex;justify-content:center">'+
        pairBox(S.turn.ex, S.turn.gu)+'</div>'+
      '<div class="lw">осталось '+num(Math.ceil(frozen/1000),"секунда","секунды","секунд")+'</div>'+
    '</div>'+
    '<div style="height:20px"></div>'+
    '<ion-button id="fl-go" style="min-width:230px">'+
      '<span style="display:inline-flex;align-items:center;gap:8px">'+
      '<span style="width:16px;height:16px;display:block">'+IC.play+'</span>Продолжить ход</span></ion-button>';

  byId("o-flash").hidden = false;
  byId("fl-go").onclick = resumeAfterBoundary;
  renderBar(); renderCtx(); renderProgress(); save();
}

function resumeAfterBoundary(){
  byId("o-flash").hidden = true;
  drawWord();
  S.wordShownAt = Date.now();
  S.turn.streak = 0;
  renderTurn(); renderBar(); renderCtx();
  wakeOn();
  runTimer();
}

function runTimer(){ stopTimer(); lastTick=Date.now(); tick(); }
function tick(){
  var now=Date.now();
  S.turn.remainingMs-=(now-lastTick);
  lastTick=now;
  if(S.turn.remainingMs<=0){
    S.turn.remainingMs=0; paintClock(); stopTimer(); beep(); buzz([140,70,140]); endTurn(); return;
  }
  paintClock();
  timerRaf=requestAnimationFrame(tick);
}
function stopTimer(){ if(timerRaf){ cancelAnimationFrame(timerRaf); timerRaf=null; } }
function paintClock(){
  var c=byId("clock");
  if(!c||!S.turn) return;
  var s=Math.ceil(Math.max(0,S.turn.remainingMs)/1000);
  c.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  c.className="clock"+(s<=10?" low":"");
  renderProgress();
}
function endTurn(){
  wakeOff();
  if(S.turn.current){
    var w=word(S.turn.current); if(w) w.returns++;
    S.turn.items.push({wordId:S.turn.current, guessed:false, round:S.round, ms:null});
    S.hat.push(S.turn.current);
    S.hat=shuffle(S.hat);
    S.turn.current=null;
  }
  S.log.push({no:S.turn.no, ex:S.turn.ex, gu:S.turn.gu,
    startRound:S.turn.startRound, endRound:S.round, items:S.turn.items.slice()});
  S.turn = null;          // иначе secsLeft() потом отдаёт 0 на экране передачи
  S.phase="review";
  go();
}

function radarSVG(){
  var order=S.players, n=order.length;
  if(n<3) return "";
  var m={}; scores().forEach(function(s){ m[s.id]=s.pts; });
  var max=Math.max(1, Math.max.apply(null, order.map(function(p){ return m[p.id]||0; })));
  var W=250,H=210,cx=W/2,cy=H/2+4,R=62,parts=[],labels=[];
  function pt(i,f){ var a=-Math.PI/2+i*(2*Math.PI/n); return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; }
  [1/3,2/3,1].forEach(function(f){
    var d=order.map(function(_,i){ var p=pt(i,f); return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
    parts.push('<polygon points="'+d+'" fill="none" stroke="#CAD2DE" stroke-width="1"'+(f===1?'':' stroke-dasharray="2 3"')+'/>');
  });
  order.forEach(function(_,i){
    var p=pt(i,1);
    parts.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#CAD2DE" stroke-width="1"/>');
  });
  var poly=order.map(function(p,i){ var q=pt(i,(m[p.id]||0)/max); return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" ");
  parts.push('<defs><linearGradient id="rgrad" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#5AA9F7" stop-opacity=".52"/>'+
    '<stop offset="100%" stop-color="#1F6FEB" stop-opacity=".12"/></linearGradient></defs>');
  parts.push('<polygon class="radarpoly" points="'+poly+'" fill="url(#rgrad)" stroke="#1F6FEB" '+
    'stroke-width="2.2" stroke-linejoin="round"/>');
  order.forEach(function(p,i){
    var q=pt(i,(m[p.id]||0)/max);
    parts.push('<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="#1F6FEB" stroke="#FAFCFF" stroke-width="2"/>');
    var lp=pt(i,1.30), a=-Math.PI/2+i*(2*Math.PI/n), cos=Math.cos(a);
    var anchor=cos>0.25?"start":(cos<-0.25?"end":"middle");
    labels.push('<text x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="'+anchor+'" font-family="Archivo, sans-serif" font-size="10.5" font-weight="600" fill="#141820">'+esc(p.name)+'</text>'+
      '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+11).toFixed(1)+'" text-anchor="'+anchor+'" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A6472">'+(m[p.id]||0)+'</text>');
  });
  parts.push('<text x="'+(cx+3)+'" y="'+(cy-R+1)+'" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#8A94A4">'+max+'</text>');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:250px" role="img" aria-label="Очки игроков">'+parts.join("")+labels.join("")+'</svg>';
}

/* ------------------------------------------------------------
   Эмоциональная реакция на ход. Строка выбирается по номеру хода,
   чтобы не прыгала при перерисовке от правки отметок.
   ------------------------------------------------------------ */
/* Формулировки без привязки к роду: никаких «смог», «сыграла» и прочего,
   что пришлось бы угадывать по имени. */
var MOOD = {
  zero:[
    "Ни одного. Шляпа сегодня держит оборону.",
    "Пусто. Иногда слова просто не хотят.",
    "Ноль. Зато следующий ход с чистого листа.",

    "Ничего. Зато сколько эмоций.",
    "Не зашло. Слова подождут, они терпеливые.",
    "Глухо. Но шляпа-то никуда не денется.",
    "Ноль слов и целая минута жизни. Красиво."
  ],
  own:[
    "Собственное слово, и мимо. Грабли своего производства.",
    "У {n} не вышло объяснить своё же слово. Вот это ирония.",
    "Слово придумал {n}. Слово же и не далось.",
    "Своё не поддалось. Шляпа злопамятна.",
    "Автор слова - {n}. Автор на нём и застрял.",
    "Придумать было легче, чем объяснить. Правда, {n}?",
    "Написать - одно, объяснить - совсем другое.",
    "{n}, это было ваше слово. Просто напоминаем."
  ],
  record:[
    "Рекорд партии. Кто рискнёт переплюнуть?",
    "Лучший ход за вечер. Планка поднята.",
    "Ух ты. Остальным теперь есть куда стремиться.",
    "Новый максимум. Аплодисменты.",
    "Так ещё никто не делал. Пока.",
    "Рекорд. Скриньте, потом не поверят.",
    "Верхняя строчка теперь ваша. Ненадолго?",
    "Это будет сложно повторить."
  ],
  clean:[
    "Ни одного промаха. Идеально.",
    "Чисто. Ни одно слово не вернулось в шляпу.",
    "Без потерь. Красиво.",
    "Ни единой осечки. Так и надо."
  ],
  great:[
    "С полуслова. Так и надо.",
    "Мощно. Шляпа заметно похудела.",
    "Вот это сыгранность.",
    "Темп высокий, слова не успевают.",
    "Шляпа не ожидала такого напора.",
    "Отличный заход. Остальные напряглись.",
    "Кажется, вы двое репетировали."
  ],
  good:[
    "Крепко сыграно.",
    "Хороший темп, без провалов.",
    "Ровный ход. Надёжно.",
    "Достойно. Так держать.",
    "Спокойно и уверенно.",
    "Нормальный улов."
  ],
  ok:[
    "Начало положено.",
    "По чуть-чуть тоже считается.",
    "Немного, но в копилку.",
    "Скромно, зато честно.",
    "Один шаг - тоже шаг.",
    "Лиха беда начало."
  ]
};
function bestBefore(no){
  var m = 0;
  S.log.forEach(function(t){
    if(t.no >= no) return;
    var g = t.items.filter(function(i){ return i.guessed; }).length;
    if(g > m) m = g;
  });
  return m;
}
function reviewMood(t, got){
  // разброс, чтобы соседние ходы не шли по списку подряд
  function pick(arr){ return arr[(t.no*7 + got*3) % arr.length]; }
  function own(){ return {cls:"joke", ic:IC.rake, text:pick(MOOD.own).replace(/\{n\}/g, esc(pname(t.ex)))}; }

  var ownMiss = false, misses = 0;
  t.items.forEach(function(it){
    if(it.guessed) return;
    misses++;
    var w = word(it.wordId);
    if(w && w.authorId === t.ex) ownMiss = true;
  });

  if(got === 0) return ownMiss ? own() : {cls:"soft", ic:IC.smile, text:pick(MOOD.zero)};
  if(got >= 3 && got > bestBefore(t.no)) return {cls:"wow", ic:IC.star, text:pick(MOOD.record)};
  if(ownMiss) return own();
  if(got >= 3 && misses === 0) return {cls:"wow", ic:IC.star, text:pick(MOOD.clean)};
  if(got >= 5) return {cls:"good", ic:IC.check, text:pick(MOOD.great)};
  if(got >= 3) return {cls:"good", ic:IC.check, text:pick(MOOD.good)};
  return {cls:"soft", ic:IC.smile, text:pick(MOOD.ok)};
}

function renderReview(){
  var el=byId("s-review"), t=S.log[S.log.length-1];
  if(!t){ S.phase="handoff"; go(); return; }
  var got=t.items.filter(function(i){ return i.guessed; }).length;
  var last=(S.round===3)&&(S.round3Turns+1>=S.players.length);
  var mood=reviewMood(t, got);
  el.innerHTML =
    '<div class="pad">'+
      '<div>'+pairBox(t.ex,t.gu,"")+
      '<h1 style="margin-top:4px">'+num(got,"слово","слова","слов")+' угадано</h1></div>'+
      '<div class="mood '+mood.cls+'"><span class="mi">'+mood.ic+'</span>'+
        '<span class="mt">'+mood.text+'</span></div>'+
      (t.items.length ? '<div>'+t.items.map(function(it,i){
          return '<button class="wrow" data-i="'+i+'" data-on="'+(it.guessed?1:0)+'">'+
            '<span class="mark">'+IC.check+'</span>'+
            '<span class="wt">'+esc(wtext(it.wordId))+'</span>'+
            (t.startRound!==t.endRound?'<span class="rd">Р'+it.round+'</span>':'')+'</button>';
        }).join("")+'</div>' : '<div class="stub">За ход не сыграно ни одного слова</div>')+
      (t.startRound!==t.endRound
        ? '<div class="note">Ход прошёл через границу раунда: начался в '+t.startRound+', закончился в '+t.endRound+'.</div>' : '')+
      '<div class="radarwrap"><div class="radarcap">расклад очков</div>'+radarSVG()+'</div>'+
      '<div class="spacer"></div>'+
      '<div class="actions"><ion-button id="rnext" expand="block">'+
        (last?"Посмотреть результаты":"Начать следующий ход")+'</ion-button></div>'+
    '</div>';
  el.querySelectorAll(".wrow").forEach(function(b){
    b.onclick=function(){ t.items[+b.dataset.i].guessed=!t.items[+b.dataset.i].guessed; go(); };
  });
  byId("rnext").onclick=advance;
}

function advanceState(){
  var n=S.order.length;
  if(S.round===3) S.round3Turns++;
  if(S.round===3 && S.round3Turns>=S.players.length) return true;
  S.idx++;
  if(S.idx>=n){
    S.idx=0; S.lap++;
    if(S.round!==3) S.order=shuffle(S.order);
  }
  return false;
}
function advance(){
  if(advanceState()){ finish(); return; }
  S.phase="handoff";
  go();
}

/* ---------- журнал ---------- */
function journalHTML(){
  var rev=S.log.slice().reverse(), out="", cur=null;
  rev.forEach(function(t){
    if(t.endRound!==cur){
      cur=t.endRound;
      out+='<div class="rdiv"><span>Раунд '+cur+' · '+esc(ROUNDS[cur].name)+'</span></div>';
    }
    var g=t.items.filter(function(i){ return i.guessed; }).length;
    var open=(S.openAcc && S.openAcc["t"+t.no])?"1":"0";
    out+='<div class="acc" data-open="'+open+'">'+
      '<button class="acchead" data-acc="t'+t.no+'">'+
        '<span class="tno">'+t.no+'</span>'+ pairBox(t.ex,t.gu) +
        '<span class="cnt">'+g+'</span>'+
        '<span class="chev">'+IC.chev+'</span></button>'+
      '<div class="accbody">'+
        (t.startRound!==t.endRound ? '<div class="hint" style="padding:3px 0">ход начался в раунде '+t.startRound+'</div>' : '')+
        t.items.map(function(it,i){
          return '<button class="wrow" data-t="'+t.no+'" data-i="'+i+'" data-on="'+(it.guessed?1:0)+'">'+
            '<span class="mark">'+IC.check+'</span>'+
            '<span class="wt">'+esc(wtext(it.wordId))+'</span></button>';
        }).join("")+
      '</div></div>';
  });
  return out;
}
function bindJournal(root){
  root.querySelectorAll("[data-acc]").forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.acc;
      if(!S.openAcc) S.openAcc={};
      S.openAcc[k]=!S.openAcc[k];
      if(S.phase==="results") renderResults(); else renderSheet();
      save();
    };
  });
  root.querySelectorAll(".wrow[data-t]").forEach(function(b){
    b.onclick=function(){
      var no=+b.dataset.t, i=+b.dataset.i;
      for(var k=0;k<S.log.length;k++){
        if(S.log[k].no===no){ S.log[k].items[i].guessed=!S.log[k].items[i].guessed; break; }
      }
      if(S.phase==="results") renderResults(); else renderSheet();
      save();
    };
  });
}

/* ---------- пауза ---------- */
function openSheet(tab){
  if(S.phase==="turn"){ stopTimer(); wakeOff(); }
  S._resume=S.phase;
  S._tab=tab||"score";
  renderSheet();
  byId("o-sheet").hidden=false;
  save();
}
function resumeLine(){
  if(["setup","entry","results","home","rules","stats"].indexOf(S._resume)>=0) return "";
  var pr=S.turn?{ex:S.turn.ex,gu:S.turn.gu}:currentPair();
  var s=secsLeft();
  var tail = s>0 ? "осталось "+num(s,"секунда","секунды","секунд")
    : (S._resume==="turn" ? "ход доигран" : (S._resume==="review" ? "на итоге хода" : "перед началом хода"));
  return '<div class="note pauseline">'+
      '<div class="l">Игра остановлена: '+pairBox(pr.ex,pr.gu)+'</div>'+
      '<div class="s">раунд '+S.round+', '+esc(ROUNDS[S.round].name.toLowerCase())+', '+tail+'</div>'+
    '</div>';
}
function renderSheet(){
  var inner=byId("sheet-inner"), sc=scores(), isLog=(S._tab==="log");
  var body = isLog
    ? (S.log.length ? '<div class="pad" style="gap:0">'+journalHTML()+'</div>'
                    : '<div class="pad"><div class="stub">Ходов пока нет</div></div>')
    : '<div class="pad" style="gap:12px">'+
        '<div>'+sc.map(function(s,i){
          return '<div class="place"><span class="pos">'+(i+1)+'</span>'+
            '<span class="pn">'+esc(s.name)+'</span><span class="pp">'+s.pts+'</span></div>';
        }).join("")+'</div>'+
        '<div class="radarwrap"><div class="radarcap">расклад очков</div>'+radarSVG()+'</div></div>';

  inner.innerHTML =
    '<div class="hdr"><div class="hside"></div><div class="htitle">Пауза</div>'+
    '<div class="hside right">'+hbtn("sh-close",IC.close,"Закрыть")+'</div></div>'+
    '<div class="tabwrap">'+segHTML("sh-tabs",["Счёт","Журнал"], isLog?"Журнал":"Счёт")+'</div>'+
    '<div class="sheetbody">'+body+'</div>'+
    '<div class="pad" style="flex:none;gap:10px">'+ resumeLine()+
      '<ion-button id="resume" expand="block">Вернуться в игру</ion-button>'+
      '<ion-button id="abandon" expand="block" fill="outline" color="medium">Завершить партию досрочно</ion-button>'+
      (fbAvailable() ? '<button class="fblink" id="sh-fb">Сообщить о проблеме</button>' : '')+
    '</div>';

  bindSeg("sh-tabs", function(v){
    var t=(v==="Журнал")?"log":"score";
    if(t!==S._tab){ S._tab=t; renderSheet(); }
  });
  byId("sh-close").onclick=closeSheet;
  byId("resume").onclick=closeSheet;
  byId("abandon").onclick=function(){ byId("o-sheet").hidden=true; finish(); };
  var fb=byId("sh-fb");
  if(fb) fb.onclick=openFeedback;
  bindJournal(inner);
  requestAnimationFrame(syncSticky);
}
function closeSheet(){
  byId("o-sheet").hidden=true;
  if(S._resume==="turn"){ S.phase="turn"; go(); S.wordShownAt=Date.now(); wakeOn(); runTimer(); }
  else { S.phase=S._resume; go(); }
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden && S && S.phase==="turn"){ openSheet("score"); }
});

function scores(){
  var m={};
  S.players.forEach(function(p){ m[p.id]=0; });
  S.log.forEach(function(t){
    t.items.forEach(function(it){
      if(!it.guessed) return;
      if(m[t.ex]!==undefined) m[t.ex]++;
      if(m[t.gu]!==undefined) m[t.gu]++;
    });
  });
  return S.players.map(function(p){ return {id:p.id,name:p.name,pts:m[p.id]}; })
    .sort(function(a,b){ return b.pts-a.pts; });
}
function stats(){
  var pairs={},hardest=null,fastest=null,byAuthor={};
  S.log.forEach(function(t){
    var key=t.ex<t.gu?t.ex+"|"+t.gu:t.gu+"|"+t.ex;
    if(!pairs[key]) pairs[key]={a:t.ex,b:t.gu,n:0};
    t.items.forEach(function(it){
      if(!it.guessed) return;
      pairs[key].n++;
      if(it.ms!==null && (!fastest||it.ms<fastest.ms)) fastest={ms:it.ms,wordId:it.wordId,gu:t.gu};
    });
  });
  S.words.forEach(function(w){
    if(!hardest||w.returns>hardest.returns) hardest=w;
    if(!byAuthor[w.authorId]) byAuthor[w.authorId]={ret:0,n:0};
    byAuthor[w.authorId].ret+=w.returns;
    byAuthor[w.authorId].n++;
  });
  var bestPair=null;
  Object.keys(pairs).forEach(function(k){ if(!bestPair||pairs[k].n>bestPair.n) bestPair=pairs[k]; });
  var tough=null;
  Object.keys(byAuthor).forEach(function(id){
    var avg=byAuthor[id].ret/Math.max(1,byAuthor[id].n);
    if(!tough||avg>tough.avg) tough={id:id,avg:avg};
  });
  return {bestPair:bestPair,hardest:hardest,fastest:fastest,tough:tough};
}

/* титулы в виде готовых строк: история не должна зависеть от id игроков */
function titlesSnapshot(){
  var st=stats(), out={};
  if(st.bestPair) out.bestPair={v:pname(st.bestPair.a)+" и "+pname(st.bestPair.b),
    d:num(st.bestPair.n,"слово","слова","слов")+" на двоих за партию"};
  if(st.hardest && st.hardest.returns>0) out.hardest={v:st.hardest.text,
    d:"возвращалось в шляпу "+num(st.hardest.returns,"раз","раза","раз")};
  if(st.tough && st.tough.avg>0) out.tough={v:pname(st.tough.id),
    d:"слова возвращались чаще всех, в среднем "+dec(st.tough.avg)};
  if(st.fastest) out.fastest={v:wtext(st.fastest.wordId),
    d:pname(st.fastest.gu)+" · "+dec(st.fastest.ms/1000)+" с"};
  return out;
}

function finish(){
  stopTimer(); wakeOff();
  var snap = titlesSnapshot(), sc = scores();
  S.phase="results"; S.turn=null; S.rtab="score";
  go();
  pushHist({
    at:Date.now(), durationMs: Date.now() - (S.createdAt || Date.now()),
    players:S.players.slice(), scores:sc, settings:S.settings,
    turns:S.log.length, words:S.words.length, titles:snap
  });
}

function renderResults(){
  var el=byId("s-results"), sc=scores(), st=stats();
  var top=sc.length?sc[0].pts:0, win=sc[0];
  var isLog = (S.rtab==="log");

  var tag = titleBlock;

  var scoreTab =
    '<div class="winner">'+
      '<div class="cup">'+IC.cup+'</div>'+
      '<div class="wlab">победа</div>'+
      '<div class="wname">'+esc(win?win.name:"")+'</div>'+
      '<div class="wpts">'+num(top,"очко","очка","очков")+'</div>'+
    '</div>'+
    '<div>'+sc.map(function(s,i){
      return '<div class="place'+(s.pts===top&&top>0?" win":"")+'"><span class="pos">'+(i+1)+'</span>'+
        '<span class="pn">'+esc(s.name)+'</span><span class="pp">'+s.pts+'</span></div>';
    }).join("")+'</div>'+
    '<div class="titles">'+
      tag("blue", IC.duo, "Лучшая пара",
        st.bestPair ? esc(pname(st.bestPair.a))+" и "+esc(pname(st.bestPair.b)) : null,
        st.bestPair ? num(st.bestPair.n,"слово","слова","слов")+" на двоих за партию" : null)+
      tag("gold", IC.lock, "Самое сложное слово",
        st.hardest && st.hardest.returns>0 ? esc(st.hardest.text) : null,
        st.hardest && st.hardest.returns>0 ? "возвращалось в шляпу "+num(st.hardest.returns,"раз","раза","раз") : null)+
      tag("violet", IC.shield, "Непробиваемый набор",
        st.tough && st.tough.avg>0 ? esc(pname(st.tough.id)) : null,
        st.tough && st.tough.avg>0 ? "слова возвращались чаще всех, в среднем "+dec(st.tough.avg) : null)+
      tag("green", IC.bolt, "Скорострел",
        st.fastest ? esc(wtext(st.fastest.wordId)) : null,
        st.fastest ? esc(pname(st.fastest.gu))+" · "+dec(st.fastest.ms/1000)+" с" : null)+
    '</div>'+
    '<div class="radarwrap"><div class="radarcap">итоговый расклад</div>'+radarSVG()+'</div>';

  el.innerHTML =
    '<div class="tabwrap">'+segHTML("res-tabs",["Счёт","Журнал"], isLog?"Журнал":"Счёт")+'</div>'+
    '<div class="pad" style="gap:14px">'+
      (isLog ? (S.log.length ? journalHTML() : '<div class="stub">Ходов не было</div>') : scoreTab)+
      '<div class="spacer"></div>'+
      '<div class="actions"><ion-button id="again" expand="block">'+
        '<span style="display:inline-flex;align-items:center;gap:8px">'+
        '<span style="width:17px;height:17px;display:block">'+IC.repeat+'</span>Сыграть тем же составом</span>'+
      '</ion-button>'+
      (fbAvailable() ? '<button class="fblink" id="res-fb">Рассказать, как вам игра</button>' : '')+
      '</div>'+
    '</div>';

  bindSeg("res-tabs", function(v){
    var t=(v==="Журнал")?"log":"score";
    if(t!==S.rtab){ S.rtab=t; renderResults(); }
  });
  bindJournal(el);
  var fb=byId("res-fb");
  if(fb) fb.onclick=openFeedback;
  byId("again").onclick=function(){
    var names=S.players.map(function(p){ return p.name; }), st2=S.settings, dv=S.devState;
    S=freshState(names,st2);
    S.devState=dv; S.phase="entry"; S.entryIndex=0;
    go();
  };
}

var SCREENS = {
  home:["s-home",renderHome], rules:["s-rules",renderRules], stats:["s-stats",renderStats],
  setup:["s-setup",renderSetup], entry:["s-entry",renderEntry],
  handoff:["s-handoff",renderHandoff], turn:["s-turn",renderTurn],
  review:["s-review",renderReview], results:["s-results",renderResults]
};
function syncSticky(){
  document.querySelectorAll(".actions").forEach(function(a){
    var sc = a.closest(".screen, .sheetbody");
    if(!sc){ a.classList.remove("stuck"); return; }
    a.classList.toggle("stuck", sc.scrollHeight > sc.clientHeight + 2);
  });
}
window.addEventListener("resize", syncSticky);

function go(){
  Object.keys(SCREENS).forEach(function(k){ byId(SCREENS[k][0]).hidden=(k!==S.phase); });
  var def=SCREENS[S.phase];
  if(def) def[1]();

  var node = def ? byId(def[0]) : null;
  if(node && !reduced()){ node.classList.remove("enter"); void node.offsetWidth; node.classList.add("enter"); }

  var playing = ["handoff","turn","review"].indexOf(S.phase) >= 0;
  byId("app").classList.toggle("playing", playing);
  byId("dots").hidden = !(playing || S.phase === "home");
  if(S.phase !== "home"){ clearInterval(hatTimer); hatTimer = null; }

  renderBar(); renderCtx(); renderProgress(); renderDev(); save();
  requestAnimationFrame(syncSticky);
}

(function(){
  var thumb=byId("scrollthumb"), hide=null;
  document.addEventListener("scroll", function(e){
    var el=e.target;
    if(!el||!el.classList) return;
    if(!el.classList.contains("screen") && !el.classList.contains("sheetbody")) return;
    var area=el.closest(".screenarea");
    if(!area) return;
    if(el.scrollHeight<=el.clientHeight+2){ thumb.style.opacity=0; return; }
    var h=Math.max(26, el.clientHeight*(el.clientHeight/el.scrollHeight));
    var t=(el.scrollTop/(el.scrollHeight-el.clientHeight))*(el.clientHeight-h);
    var r=el.getBoundingClientRect(), ar=area.getBoundingClientRect();
    thumb.style.height=h+"px";
    thumb.style.top=(r.top-ar.top+t)+"px";
    thumb.style.opacity=1;
    clearTimeout(hide);
    hide=setTimeout(function(){ thumb.style.opacity=0; },700);
  },true);
})();

(function(){
  function t(){
    var d=new Date(), e=byId("sb-time");
    if(e) e.textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
  }
  t(); setInterval(t,20000);
})();

function unlockAudio(){
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
  }catch(e){}
}
function beep(){
  try{
    if(!audio) return;
    var o=audio.createOscillator(), g=audio.createGain();
    o.type="square"; o.frequency.value=440;
    g.gain.setValueAtTime(0.14,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+0.55);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime+0.56);
  }catch(e){}
}

/* ?app - только продукт, без рельсы и корпуса: так его можно открыть на телефоне */
(function(){
  var q = (location.search + location.hash).toLowerCase();
  if(q.indexOf("app") >= 0) document.body.classList.add("appmode");
})();

(function(){
  var r = byId("dev-reset");
  if(r) r.onclick = function(){ devJump((S&&S.devState)||"home"); };
})();

function boot(hot){
  var restored=(hot&&hot.S)||loadCur();
  if(restored && restored.phase && ["home","setup","results","rules","stats"].indexOf(restored.phase)<0){
    S=restored;
    if(!S.openAcc) S.openAcc={};
    if(!S.devState) S.devState=S.phase;
    if(!S.rtab) S.rtab="score";
    if(S.phase==="turn"){
      S.carryMs=S.turn?S.turn.remainingMs:null;
      S.turnNo=Math.max(0,S.turnNo-1);
      S.turn=null; S.phase="handoff";
    }
    go(); return;
  }
  S=freshState([], {wordsPerPlayer:5, turnSeconds:60});
  go();
}

try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {S:S}; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});
  } else { boot({}); }
}catch(e){ boot({}); }

})();
</script>
